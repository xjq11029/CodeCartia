ct.freeze({\n  role: 'realm-purchase:auditor',\n  permission: 'request.export',\n  effect: 'allow',\n});\n// @evidence F.declaration.unassociated:end\n","lineCount":10,"sha256":"a0415f433f7b32993451615d7de9508b9d69911de3e1cad832bfd37c7e655b2d","origin":"example-source"},{"id":"examples/purchase-demo/config/workflow.json","path":"examples/purchase-demo/config/workflow.json","relativePath":"config/workflow.json","project":"purchase-service","language":"json","content":"{\n  \"realm\": \"realm-purchase\",\n  \"actorBindings\": {\n    \"申请人\": [\"realm-purchase:employee\"],\n    \"审批人\": [\"realm-purchase:manager\"],\n    \"观察者\": [\"realm-purchase:manager\", \"realm-purchase:readonly\"]\n  }\n}\n","lineCount":9,"sha256":"a662cd0899bfe38bbb2d859a6cb229c5792f021903698f3f21286e8e1c1a7afb","origin":"example-source"},{"id":"examples/purchase-demo/data/fixtures.js","path":"examples/purchase-demo/data/fixtures.js","relativePath":"data/fixtures.js","project":"purchase-service","language":"js","content":"export const REALM = 'realm-purchase';\n\n// @evidence F.roles:start\nexport const ROLES = Object.freeze({\n  employee: `${REALM}:employee`,\n  manager: `${REALM}:manager`,\n  readonly: `${REALM}:readonly`,\n});\n\n// 无角色继承；租户不是角色 ID 的组成部分。\nexport const USERS = Object.freeze([\n  { id: 'u1', realm: REALM, tenant: 'T1', roles: [ROLES.employee] },\n  { id: 'u2', realm: REALM, tenant: 'T1', roles: [ROLES.manager] },\n  { id: 'u3', realm: REALM, tenant: 'T1', roles: [ROLES.readonly] },\n  { id: 'u4', realm: REALM, tenant: 'T2', roles: [ROLES.manager] },\n].map(user => Object.freeze({ ...user, roles: Object.freeze(user.roles) })));\n// @evidence F.roles:end\n\n// @evidence F.objects:start\nexport const REQUESTS = Object.freeze([\n  { id: 'r1', owner: 'u1', tenant: 'T1', state: 'DRAFT', amount: 1000 },\n  { id: 'r2', owner: 'u1', tenant: 'T1', state: 'SUBMITTED', amount: 1000 },\n  { id: 'r3', owner: 'u1', tenant: 'T1', state: 'SUBMITTED', amount: 6000 },\n  { id: 'r4', owner: 'u4', tenant: 'T2', state: 'SUBMITTED', amount: 1000 },\n].map(Object.freeze));\n// @evidence F.objects:end\n","lineCount":27,"sha256":"968ae79b2ecb2613710e27e8e0a611b139d422571b6f703f688bf0a254b2528d","origin":"example-source"},{"id":"examples/purchase-demo/package.json","path":"examples/purchase-demo/package.json","relativePath":"package.json","project":"purchase-service","language":"json","content":"{\n  \"name\": \"codecartia-purchase-demo\",\n  \"version\": \"0.1.0\",\n  \"private\": true,\n  \"type\": \"module\",\n  \"description\": \"供 CodeCartia 体验原型阅读的 B0 合成采购工程\",\n  \"scripts\": {\n    \"start\": \"node server/index.js\",\n    \"test\": \"node test/purchase.test.js\",\n    \"evidence\": \"node scripts/build-evidence.mjs\"\n  },\n  \"engines\": {\n    \"node\": \">=20\"\n  }\n}\n","lineCount":16,"sha256":"1aaf38f1c11269faf27b18e7210d58209e24e6824b6d0cf2c419e87cdc48e192","origin":"example-source"},{"id":"examples/purchase-demo/README.md","path":"examples/purchase-demo/README.md","relativePath":"README.md","project":"purchase-service","language":"md","content":"# B0 合成采购示例工程\n\n这是供 CodeCartia HTML 体验原型嵌入、阅读和定位的**真实示例源码**，也可独立运行。它是被阅读的目标工程，不是 CodeCartia 分析器；目录内的原生 JavaScript 技术选择不代表 CodeCartia 产品选型。没有第三方依赖、真实账号、邮件发送或外部请求。\n\n示例实现 `docs/CodeCartia-业务场景与权限验收样例.md` v0.3 中 B0 的三条路径，并执行下面列出的公开功能测试。**没有执行 CodeCartia 自动静态分析，没有取得 BS01–BS05 / AP01–AP07 的完整验收结果，也不是独立保留测试集。** HTML 体验原型只嵌入源码，不调用这个示例服务。\n\n## 运行与验证\n\n在本目录 `examples/purchase-demo/` 执行，需要 Node.js 20 或更新版本和 pnpm：\n\n```powershell\npnpm test\npnpm evidence\npnpm start\n```\n\n无需安装依赖。`pnpm test` 在同一 Node 进程直接执行 `test/purchase.test.js`，使用内置 `node:test`，无需派生隔离子进程；`pnpm evidence` 生成 `evidence-map.json`，登记逻辑证据标签、精确源码行范围和文件 SHA-256；它只按开发者声明的标签生成位置索引，不进行代码分析，也不是验收真值。\n\n`pnpm start` 将简易采购运行页面开放在 `http://127.0.0.1:4100/`，可选择 u1–u4 和 r1–r4 后读取、提交或审批。审批按钮只按 `manager` 显示，操作是否允许仍取决于后端策略及业务条件。对象选择框显示初始值，当前状态以读取结果为准。数据仅在内存中保存，刷新浏览器保留当前服务进程的状态，重启服务恢复 B0。测试也可调用 `app.reset()` 独立重置。\n\n## 合成身份、业务路径与边界\n\n\u003c!-- @evidence F.doc.flow:start -->\n提交采购申请由同租户且为申请所有者的 employee 发起；只有 DRAFT 且金额大于 0 的申请可转为 SUBMITTED，并通过共享审计函数记录提交。\n\n审批采购申请要求同租户、非申请所有者的 manager。通过授权后，只有 SUBMITTED 且金额不超过 5000 元的申请可审批。APPROVED 状态与审批审计在同一个同步内存事务中提交；审计写入或事务提交失败则整个副本丢弃，不留下成功状态或审计。事务成功后调用回执：回执失败仅记录错误，已提交审批不回滚。\n\n读取采购申请允许 employee 读取同租户自己的申请，manager 与 readonly 读取同租户申请。共享仓储和审计函数不会自动把这三个动作串成必然执行的完整流程。\n\u003c!-- @evidence F.doc.flow:end -->\n\n身份域为 `realm-purchase`，角色 ID 带该域，租户另行检查，没有默认角色继承。宿主预先建立 `demo-u1` 至 `demo-u4` 固定合成会话；本地页面通过 `x-demo-session` 选择会话，路由从已绑定的会话上下文取得主体。请求体中的 userId、roles、tenant、owner、amount 不参与身份或资源绑定。**这些可任意选择的演示 token 不能用于生产认证。**\n\n| 主体 | 角色 | 租户 |\n|---|---|---|\n| u1 | employee | T1 |\n| u2 | manager | T1 |\n| u3 | readonly | T1 |\n| u4 | manager | T2 |\n\n| 申请 | 所有者 | 租户 | 初始状态 | 金额（测试指定元） |\n|---|---|---|---|---|\n| r1 | u1 | T1 | DRAFT | 1000 |\n| r2 | u1 | T1 | SUBMITTED | 1000 |\n| r3 | u1 | T1 | SUBMITTED | 6000 |\n| r4 | u4 | T2 | SUBMITTED | 1000 |\n\n工作流实际读取 `config/workflow.json`：申请人候选映射 employee，审批人候选映射 manager，观察者候选映射 manager/readonly。处理器调用候选人选择器生成响应中的候选列表；候选人配置不授予操作权限。审批候选即使包含申请所有者，也仍受后端禁止自审的授权约束。\n\n仓储的“提交”只指当前进程内的原子状态替换，不提供数据库或磁盘耐久性。事务回调是同步的，回执才是异步调用。回执“sent”只说明内存模拟记录写入成功，不能证明邮件或其他外部通知送达。故障注入仅供测试编排，未挂载为 HTTP 接口。\n\n## 源码入口和证据\n\n```text\npurchase-demo/\n├─ package.json\n├─ README.md\n├─ evidence-map.json              # pnpm evidence 生成的位置和指纹索引\n├─ data/fixtures.js               # F.roles、F.objects：B0 合成输入\n├─ config/\n│  ├─ workflow.json               # 真实参与者角色映射配置\n│  └─ declarations.js             # 独立未引用声明，原型诊断扩展\n├─ web/\n│  ├─ index.html                  # 简易运行页面\n│  ├─ PurchasePage.js             # F.ui.approve：只看 manager 的按钮可见性\n│  └─ api.js                      # F.client.submit / approve / read\n├─ server/\n│  ├─ index.js                    # 本地 HTTP 宿主与静态页面入口\n│  ├─ app.js                      # 内存实例、会话上下文、路由装配与重置\n│  ├─ routes.js                   # F.route.*：认证 → 资源绑定 → 授权 → 处理器\n│  ├─ auth.js                     # F.identity：合成会话与认证上下文\n│  ├─ policies.js                 # F.policy.submit / approve / read\n│  ├─ handlers.js                 # F.handler.*、F.commit.submit、F.tx.approve\n│  ├─ repository.js               # 同步副本事务，原子替换已提交状态\n│  ├─ audit.js                    # F.audit：提交与审批共用的事务内审计\n│  ├─ receipt.js                  # F.receipt：合成发送、失败记录、重置\n│  ├─ workflow.js                 # F.workflow.load、F.workflow.candidates\n│  └─ errors.js                   # 授权、业务与事务错误的状态/代码\n├─ scripts/build-evidence.mjs     # 标签 → 行范围/文件 SHA-256\n└─ test/purchase.test.js          # 内置测试器的公开功能用例\n```\n\n每个逻辑段使用成对 `// @evidence F.xxx:start` / `// @evidence F.xxx:end` 注释，可用于 HTML 原型定位。工作流 JSON 全文件使用唯一位置映射 `F.workflow.actor-bindings`，索引另提供同位置的 `F.workflow.config` 别名；实际候选选择对应 loader 中 `F.workflow.candidates`。业务描述 `F.doc.flow` 使用本 README 中的成对 HTML 注释；它是文档解释，需与源码事实分开呈现。\n\n## 原型诊断扩展\n\n除 B0 运行路径外，本目录有两个供体验原型展示边界的独立扩展，均不改变 B0 的角色、授权与业务条件：\n\n- `config/declarations.js` 的 `F.declaration.unassociated` 仅导出孤立的 `auditor` / `request.export` 允许声明，没有被入口、策略、工作流或处理器引用。它不证明存在导出业务，也不授予 u1–u4 新权限。\n- `server/receipt.js` 的 `F.receipt.target` 接收运行时目的地标签，只将标签记入内存。宿主通过 `app.handle({ receiptTarget })` 或 `x-demo-receipt-target` 传入，缺省标签为 `demo-memory-inbox`。原型未静态求取所有可能的运行时目的地，不能从这个参数推断外部收件人、邮件系统或真实送达。该扩展不添加网络请求。\n\n## 已覆盖的功能验证范围\n\n测试覆盖 B0 的 u1–u4 × r1–r4 在三个动作中的 48 个结果组合、三个入口的认证拒绝、请求体伪造不改变身份或资源、提交状态/金额规则、审批状态/金额规则、共享审计、禁止自审、同租户他人数据限制、事务提交/审计失败、回执失败不回滚、重复操作、配置候选不授予权限、实例隔离与重置。\n\n已在 Node.js v24.11.0、pnpm 10.20.0 上执行 `pnpm test`，24 项测试全部通过；`pnpm evidence` 成功生成 31 个证据标签。`pnpm start` 的本地 HTTP 冒烟已验证 HTML、三个浏览器模块、r2 从 SUBMITTED 审批为 APPROVED 后的读取，以及跨租户审批返回 403。示例服务在验证后已停止，需自行执行 `pnpm start` 启动。\n\n额外的 r5 自审、r6 employee 读取他人申请、金额边界和候选配置替换属于本示例功能测试的独立局部变体，不与 B0 原始源码快照合并。未实现 BS/AP 中的消息入口、角色继承、有序策略、外部策略、未关联权限声明、增量分析、AI/人工覆盖或导出评估。\n","lineCount":98,"sha256":"94fe86cefeb41122f44ef79b83685be51880d4620764d62d18e768d5e4dd8fa2","origin":"example-source"},{"id":"examples/purchase-demo/server/app.js","path":"examples/purchase-demo/server/app.js","relativePath":"server/app.js","project":"purchase-service","language":"js","content":"import { createDemoSessions, establishDemoContext } from './auth.js';\nimport { createRepository } from './repository.js';\nimport { createReceiptSender } from './receipt.js';\nimport { loadWorkflow } from './workflow.js';\nimport { createHandlers } from './handlers.js';\nimport { createRoutes } from './routes.js';\nimport { DemoError } from './errors.js';\n\nexport function createPurchaseApp(options = {}) {\n  const sessions = createDemoSessions(options.users);\n  const repository = createRepository(options.requests);\n  const receipt = createReceiptSender();\n  const workflow = options.workflow ?? loadWorkflow();\n  const handlers = createHandlers({ repository, receipt, workflow });\n  const dispatch = createRoutes({ repository, handlers });\n\n  return {\n    // sessionToken 是宿主识别演示会话的参数；body 不参与认证或资源绑定。\n    async handle({ method, path, sessionToken, body, receiptTarget }) {\n      const context = Object.freeze({\n        ...establishDemoContext(sessions, sessionToken),\n        // 原型诊断扩展：宿主可提供运行时目的地，仅供内存模拟记录。\n        receiptTarget: receiptTarget ?? 'demo-memory-inbox',\n      });\n      try {\n        const result = await dispatch({ method, path, context });\n        return { status: 200, body: result };\n      } catch (error) {\n        if (error instanceof DemoError) {\n          return { status: error.status, body: { error: error.code, message: error.message } };\n        }\n        throw error;\n      }\n    },\n    repository,\n    receipt,\n    workflow,\n    reset() {\n      repository.reset();\n      receipt.reset();\n    },\n  };\n}\n","lineCount":44,"sha256":"db7e22d2b870210333cbb47f5557c87aa4f14e0872a67b372761cea3d4d17aaa","origin":"example-source"},{"id":"examples/purchase-demo/server/audit.js","path":"examples/purchase-demo/server/audit.js","relativePath":"server/audit.js","project":"purchase-service","language":"js","content":"// @evidence F.audit:start\n// 提交与审批共用此函数；审计写入调用者的事务，而非独立提交。\nexport function recordAudit(tx, { action, principal, request }) {\n  tx.appendAudit({\n    action,\n    actor: principal.id,\n    realm: principal.realm,\n    tenant: principal.tenant,\n    requestId: request.id,\n    state: request.state,\n  });\n}\n// @evidence F.audit:end\n","lineCount":14,"sha256":"0ecc56e765ad4b4dfe6ba053fcce49f7d132c8328fd2bd99b1d35f6f3c311937","origin":"example-source"},{"id":"examples/purchase-demo/server/auth.js","path":"examples/purchase-demo/server/auth.js","relativePath":"server/auth.js","project":"purchase-service","language":"js","content":"import { REALM, USERS } from '../data/fixtures.js';\nimport { DemoError } from './errors.js';\n\n// @evidence F.identity:start\n// 合成认证：本地宿主预先建立演示会话。固定 token 可任意选择，不能用于生产。\nexport function createDemoSessions(users = USERS) {\n  return new Map(users.map(user => {\n    const principal = Object.freeze({\n      id: user.id,\n      realm: user.realm,\n      tenant: user.tenant,\n      roles: Object.freeze([...user.roles]),\n      authenticated: true,\n    });\n    return [`demo-${user.id}`, Object.freeze({ principal, mode: 'synthetic-demo' })];\n  }));\n}\n\nexport function establishDemoContext(sessions, sessionToken) {\n  return Object.freeze({ session: sessions.get(sessionToken) ?? null });\n}\n\nexport function authenticate(context) {\n  // 只读取宿主绑定的 session；不接收 body.userId/body.roles/body.tenant。\n  const principal = context.session?.principal;\n  if (!principal?.authenticated || principal.realm !== REALM) {\n    throw new DemoError(401, 'AUTHENTICATION_REQUIRED', '需要有效的合成演示会话');\n  }\n  return principal;\n}\n// @evidence F.identity:end\n","lineCount":32,"sha256":"52dd4bb11048b52d9fae3fc4df4120d12e4bbb56402f603b3e5ce6f5ae0f625e","origin":"example-source"},{"id":"examples/purchase-demo/server/errors.js","path":"examples/purchase-demo/server/errors.js","relativePath":"server/errors.js","project":"purchase-service","language":"js","content":"export class DemoError extends Error {\n  constructor(status, code, message) {\n    super(message);\n    this.name = 'DemoError';\n    this.status = status;\n    this.code = code;\n  }\n}\n","lineCount":9,"sha256":"e4ea569e6c69ede981033092a85a3a905b151de3aebed8f76eeb968f29c42971","origin":"example-source"},{"id":"examples/purchase-demo/server/handlers.js","path":"examples/purchase-demo/server/handlers.js","relativePath":"server/handlers.js","project":"purchase-service","language":"js","content":"import { DemoError } from './errors.js';\nimport { recordAudit } from './audit.js';\n\nexport function createHandlers({ repository, receipt, workflow }) {\n  // @evidence F.handler.submit:start\n  function submit(principal, request) {\n    if (request.state !== 'DRAFT') {\n      throw new DemoError(409, 'INVALID_STATE', '只有 DRAFT 申请可以提交');\n    }\n    if (!(request.amount > 0)) {\n      throw new DemoError(422, 'INVALID_AMOUNT', '提交金额必须大于 0 元');\n    }\n    // @evidence F.commit.submit:start\n    const submitted = repository.transaction(tx => {\n      const updated = tx.setState(request.id, 'SUBMITTED');\n      recordAudit(tx, { action: 'request.submit', principal, request: updated });\n      return updated;\n    });\n    // @evidence F.commit.submit:end\n    return {\n      request: submitted,\n      nextCandidates: workflow.candidatesFor('审批人', submitted),\n    };\n  }\n  // @evidence F.handler.submit:end\n\n  // @evidence F.handler.approve:start\n  async function approve(principal, request, receiptTarget) {\n    if (request.state !== 'SUBMITTED') {\n      throw new DemoError(409, 'INVALID_STATE', '只有 SUBMITTED 申请可以审批');\n    }\n    if (!(request.amount \u003c= 5000)) {\n      throw new DemoError(422, 'AMOUNT_LIMIT', '审批金额不能超过 5000 元');\n    }\n    // @evidence F.tx.approve:start\n    const approved = repository.transaction(tx => {\n      const updated = tx.setState(request.id, 'APPROVED');\n      recordAudit(tx, { action: 'request.approve', principal, request: updated });\n      return updated;\n    });\n    // @evidence F.tx.approve:end\n\n    // @evidence F.receipt.after-commit:start\n    let receiptStatus = 'sent';\n    try {\n      await receipt.send(approved, receiptTarget);\n    } catch (error) {\n      receipt.recordFailure(approved, error);\n      receiptStatus = 'failed';\n      // 事务已经提交；这里记录回执失败，不回滚 APPROVED 和审计。\n    }\n    // @evidence F.receipt.after-commit:end\n    return {\n      request: approved,\n      receipt: { status: receiptStatus, mode: 'simulated' },\n      observerCandidates: workflow.candidatesFor('观察者', approved),\n    };\n  }\n  // @evidence F.handler.approve:end\n\n  // @evidence F.handler.read:start\n  function read(principal, request) {\n    // request 由路由按同一 ID 从仓储读取，并已经通过对应读取策略。\n    return {\n      request,\n      viewedBy: principal.id,\n      applicantCandidates: workflow.candidatesFor('申请人', request),\n      observerCandidates: workflow.candidatesFor('观察者', request),\n    };\n  }\n  // @evidence F.handler.read:end\n\n  return { submit, approve, read };\n}\n","lineCount":75,"sha256":"04f939c304b9c5ae1e4fe4d94f4ca119ed76d29f61eaadee1a1e06baa543c5e3","origin":"example-source"},{"id":"examples/purchase-demo/server/index.js","path":"examples/purchase-demo/server/index.js","relativePath":"server/index.js","project":"purchase-service","language":"js","content":"import { createServer } from 'node:http';\nimport { readFile } from 'node:fs/promises';\nimport { createPurchaseApp } from './app.js';\n\nconst app = createPurchaseApp();\nconst files = new Map([\n  ['/', ['../web/index.html', 'text/html; charset=utf-8']],\n  ['/web/PurchasePage.js', ['../web/PurchasePage.js', 'text/javascript; charset=utf-8']],\n  ['/web/api.js', ['../web/api.js', 'text/javascript; charset=utf-8']],\n  ['/data/fixtures.js', ['../data/fixtures.js', 'text/javascript; charset=utf-8']],\n]);\n\ncreateServer(async (req, res) => {\n  try {\n    const url = new URL(req.url, 'http://127.0.0.1');\n    const staticFile = files.get(url.pathname);\n    if (req.method === 'GET' && staticFile) {\n      const content = await readFile(new URL(staticFile[0], import.meta.url));\n      res.writeHead(200, { 'content-type': staticFile[1], 'cache-control': 'no-store' });\n      res.end(content);\n      return;\n    }\n\n    // 演示动作只使用路由 ID，无需请求体；即使自报身份也不会参与授权。\n    req.resume();\n    const result = await app.handle({\n      method: req.method,\n      path: url.pathname,\n      sessionToken: req.headers['x-demo-session'],\n      receiptTarget: req.headers['x-demo-receipt-target'],\n    });\n    res.writeHead(result.status, { 'content-type': 'application/json; charset=utf-8' });\n    res.end(JSON.stringify(result.body));\n  } catch {\n    res.writeHead(500, { 'content-type': 'application/json; charset=utf-8' });\n    res.end(JSON.stringify({ error: 'DEMO_INTERNAL_ERROR', message: '合成演示处理异常' }));\n  }\n}).listen(4100, '127.0.0.1', () => {\n  console.log('B0 合成采购工程：http://127.0.0.1:4100（重启恢复初始数据）');\n});\n","lineCount":41,"sha256":"cddf4fb03e95f2cd1aeaed8a15d82e5e39ff9f5a3e3c759adda6db4223f2565c","origin":"example-source"},{"id":"examples/purchase-demo/server/policies.js","path":"examples/purchase-demo/server/policies.js","relativePath":"server/policies.js","project":"purchase-service","language":"js","content":"import { ROLES } from '../data/fixtures.js';\nimport { DemoError } from './errors.js';\n\nfunction requireAllowed(allowed, permission) {\n  // B0：适用允许规则任一满足即允许；无匹配规则默认拒绝。\n  if (!allowed) {\n    throw new DemoError(403, 'FORBIDDEN', `未满足 ${permission} 的授权条件`);\n  }\n}\n\n// @evidence F.policy.submit:start\nexport function authorizeSubmit(principal, request) {\n  const allowed = principal.roles.includes(ROLES.employee)\n    && principal.tenant === request.tenant\n    && principal.id === request.owner;\n  requireAllowed(allowed, 'request.submit');\n}\n// @evidence F.policy.submit:end\n\n// @evidence F.policy.approve:start\nexport function authorizeApprove(principal, request) {\n  const allowed = principal.roles.includes(ROLES.manager)\n    && principal.tenant === request.tenant\n    && principal.id !== request.owner;\n  requireAllowed(allowed, 'request.approve');\n}\n// @evidence F.policy.approve:end\n\n// @evidence F.policy.read:start\nexport function authorizeRead(principal, request) {\n  const sameTenant = principal.tenant === request.tenant;\n  const ownEmployeeRequest = principal.roles.includes(ROLES.employee)\n    && principal.id === request.owner;\n  const tenantReader = principal.roles.includes(ROLES.manager)\n    || principal.roles.includes(ROLES.readonly);\n  requireAllowed(sameTenant && (ownEmployeeRequest || tenantReader), 'request.read');\n}\n// @evidence F.policy.read:end\n","lineCount":39,"sha256":"4d1ac30cd918453310d610ea4fa984fdbd1138f89f1360d7ebb7b5d546866bf7","origin":"example-source"},{"id":"examples/purchase-demo/server/receipt.js","path":"examples/purchase-demo/server/receipt.js","relativePath":"server/receipt.js","project":"purchase-service","language":"js","content":"// @evidence F.receipt:start\nexport function createReceiptSender() {\n  const sent = [];\n  const failures = [];\n  let failNextSend = false;\n\n  return {\n    // @evidence F.receipt.target:start\n    async send(request, runtimeTarget) {\n      // 只写内存以模拟发送，没有邮件、网络或外部通知。\n      if (failNextSend) {\n        failNextSend = false;\n        throw new Error('合成回执发送失败');\n      }\n      // 目的地来自运行时参数；只保存其标签，不验证或访问任何地址。\n      sent.push({ requestId: request.id, state: request.state, target: runtimeTarget, mode: 'simulated' });\n    },\n    // @evidence F.receipt.target:end\n    recordFailure(request, error) {\n      failures.push({ requestId: request.id, message: error.message });\n    },\n    snapshot: () => structuredClone({ sent, failures }),\n    failNext() { failNextSend = true; },\n    reset() {\n      sent.length = 0;\n      failures.length = 0;\n      failNextSend = false;\n    },\n  };\n}\n// @evidence F.receipt:end\n","lineCount":32,"sha256":"4ca9f105a80240dabf8c6312b9ab29d6452a0f70b66e88a9fe89d378448160b4","origin":"example-source"},{"id":"examples/purchase-demo/server/repository.js","path":"examples/purchase-demo/server/repository.js","relativePath":"server/repository.js","project":"purchase-service","language":"js","content":"import { REQUESTS } from '../data/fixtures.js';\nimport { DemoError } from './errors.js';\n\nexport function createRepository(initialRequests = REQUESTS) {\n  let state;\n  const failures = new Set();\n\n  function reset() {\n    state = {\n      requests: Object.fromEntries(initialRequests.map(request => [request.id, { ...request }])),\n      audits: [],\n    };\n    failures.clear();\n  }\n\n  function consumeFailure(point) {\n    if (failures.delete(point)) {\n      throw new DemoError(503, 'TRANSACTION_FAILED', `合成故障：${point}`);\n    }\n  }\n\n  // @evidence F.repository.get:start\n  function get(id, from = state) {\n    const request = from.requests[id];\n    if (!request) throw new DemoError(404, 'REQUEST_NOT_FOUND', '申请不存在');\n    return { ...request };\n  }\n  // @evidence F.repository.get:end\n\n  // @evidence F.repository.transaction:start\n  // 同步内存事务：先在独立副本写入，全部成功后一次替换已提交状态。\n  // 不模拟磁盘耐久性，也不允许回调跨 await，以避免并发副本覆盖。\n  function transaction(work) {\n    const pending = structuredClone(state);\n    const tx = {\n      get: id => get(id, pending),\n      setState(id, nextState) {\n        const request = get(id, pending);\n        pending.requests[id] = { ...request, state: nextState };\n        return get(id, pending);\n      },\n      appendAudit(event) {\n        consumeFailure('audit-write');\n        pending.audits.push({ ...event });\n      },\n    };\n    const result = work(tx);\n    if (result?.then) throw new TypeError('此演示仅支持同步事务回调');\n    consumeFailure('transaction-commit');\n    state = pending;\n    return result;\n  }\n  // @evidence F.repository.transaction:end\n\n  reset();\n  return {\n    get,\n    transaction,\n    reset,\n    snapshot: () => structuredClone(state),\n    // 仅供测试编排，不挂载为 HTTP 接口。\n    failNext(point) {\n      if (!['audit-write', 'transaction-commit'].includes(point)) {\n        throw new TypeError(`未知故障点：${point}`);\n      }\n      failures.add(point);\n    },\n  };\n}\n","lineCount":70,"sha256":"51c333700931ec7a7a12c42b5e94e374f157176376fc006314bcc8a96f3d5eb4","origin":"example-source"},{"id":"examples/purchase-demo/server/routes.js","path":"examples/purchase-demo/server/routes.js","relativePath":"server/routes.js","project":"purchase-service","language":"js","content":"import { authenticate } from './auth.js';\nimport { authorizeSubmit, authorizeApprove, authorizeRead } from './policies.js';\nimport { DemoError } from './errors.js';\n\nexport function createRoutes({ repository, handlers }) {\n  const routes = [\n    // @evidence F.route.submit:start\n    {\n      method: 'POST', pattern: /^\\/requests\\/([^/]+)\\/submit$/,\n      execute(id, context) {\n        const principal = authenticate(context);\n        const request = repository.get(id);\n        authorizeSubmit(principal, request);\n        return handlers.submit(principal, request);\n      },\n    },\n    // @evidence F.route.submit:end\n    // @evidence F.route.approve:start\n    {\n      method: 'POST', pattern: /^\\/requests\\/([^/]+)\\/approve$/,\n      execute(id, context) {\n        const principal = authenticate(context);\n        const request = repository.get(id);\n        authorizeApprove(principal, request);\n        return handlers.approve(principal, request, context.receiptTarget);\n      },\n    },\n    // @evidence F.route.approve:end\n    // @evidence F.route.read:start\n    {\n      method: 'GET', pattern: /^\\/requests\\/([^/]+)$/,\n      execute(id, context) {\n        const principal = authenticate(context);\n        const request = repository.get(id);\n        authorizeRead(principal, request);\n        return handlers.read(principal, request);\n      },\n    },\n    // @evidence F.route.read:end\n  ];\n\n  return async function dispatch({ method, path, context }) {\n    const route = routes.find(candidate => candidate.method === method && candidate.pattern.test(path));\n    if (!route) throw new DemoError(404, 'ROUTE_NOT_FOUND', '入口不存在');\n    const id = decodeURIComponent(path.match(route.pattern)[1]);\n    return route.execute(id, context);\n  };\n}\n","lineCount":49,"sha256":"b4e4e20c40ec87ef3a5683fa76ffd0adffec1f79260d92f14cc5d42bd9c787cb","origin":"example-source"},{"id":"examples/purchase-demo/server/workflow.js","path":"examples/purchase-demo/server/workflow.js","relativePath":"server/workflow.js","project":"purchase-service","language":"js","content":"import { readFileSync } from 'node:fs';\nimport { USERS } from '../data/fixtures.js';\n\n// @evidence F.workflow.load:start\nexport function loadWorkflow() {\n  const config = JSON.parse(readFileSync(\n    new URL('../config/workflow.json', import.meta.url), 'utf8',\n  ));\n  return createWorkflow(config);\n}\n// @evidence F.workflow.load:end\n\nexport function createWorkflow(config, users = USERS) {\n  // @evidence F.workflow.candidates:start\n  // 配置参与实际候选人选择；候选身份不额外授予任何后端操作权限。\n  // 原始配置证据还包含 config/workflow.json 全文件。\n  function candidatesFor(actor, request) {\n    const mappedRoles = config.actorBindings[actor] ?? [];\n    return users.filter(user => user.realm === config.realm\n      && user.tenant === request.tenant\n      && user.roles.some(role => mappedRoles.includes(role)))\n      .map(user => user.id);\n  }\n  // @evidence F.workflow.candidates:end\n  return { candidatesFor };\n}\n","lineCount":27,"sha256":"7ff3fba1fc8ee53975bb63b7514e35360216fa5ed68586734cb1138de04487a5","origin":"example-source"},{"id":"examples/purchase-demo/web/api.js","path":"examples/purchase-demo/web/api.js","relativePath":"web/api.js","project":"purchase-web","language":"js","content":"let demoSessionToken = 'demo-u1';\n\nexport function selectDemoSession(userId) {\n  demoSessionToken = `demo-${userId}`;\n}\n\nasync function request(method, path) {\n  const response = await fetch(path, {\n    method,\n    headers: { 'x-demo-session': demoSessionToken },\n  });\n  const payload = await response.json();\n  return { status: response.status, ...payload };\n}\n\n// @evidence F.client.submit:start\nexport function submitRequest(id) {\n  return request('POST', `/requests/${encodeURIComponent(id)}/submit`);\n}\n// @evidence F.client.submit:end\n\n// @evidence F.client.approve:start\nexport function approveRequest(id) {\n  return request('POST', `/requests/${encodeURIComponent(id)}/approve`);\n}\n// @evidence F.client.approve:end\n\n// @evidence F.client.read:start\nexport function readRequest(id) {\n  return request('GET', `/requests/${encodeURIComponent(id)}`);\n}\n// @evidence F.client.read:end\n","lineCount":33,"sha256":"f5258098701174e34698b9275687e155a94659c7975095df160e01a523fdd796","origin":"example-source"},{"id":"examples/purchase-demo/web/index.html","path":"examples/purchase-demo/web/index.html","relativePath":"web/index.html","project":"purchase-web","language":"html","content":"\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n  \u003ctitle>B0 合成采购工程\u003c/title>\n  \u003cstyle>\n    body { max-width: 860px; margin: 50px auto; padding: 0 24px; font: 16px/1.7 system-ui,sans-serif; color:#263146; background:#f6f8fc; }\n    main { background:white; border:1px solid #dce2ec; padding:28px; border-radius:14px; }\n    h1 { margin-top:0; font-size:28px; } p { color:#586780; }\n    label { display:block; margin:14px 0; } select { width:100%; padding:10px; border:1px solid #bdc8d9; border-radius:6px; }\n    button { padding:9px 16px; margin:10px 8px 10px 0; cursor:pointer; border:1px solid #a6b6d1; border-radius:6px; background:#edf3ff; }\n    button[hidden] { display:none; } pre { overflow:auto; min-height:160px; padding:16px; background:#14223b; color:#dceaff; border-radius:8px; }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain>\n    \u003ch1>B0 合成采购工程\u003c/h1>\n    \u003cp>此页面只用于运行示例代码。主体、申请、会话与数据均为合成输入；固定演示会话不具备生产认证能力。\u003c/p>\n    \u003clabel>演示主体\u003cselect id=\"user\" aria-label=\"演示主体\">\u003c/select>\u003c/label>\n    \u003clabel>申请（标签显示初始值，当前值以读取结果为准）\u003cselect id=\"request\" aria-label=\"申请\">\u003c/select>\u003c/label>\n    \u003cdiv>\n      \u003cbutton id=\"read\">读取申请\u003c/button>\n      \u003cbutton id=\"submit\">提交申请\u003c/button>\n      \u003cbutton id=\"approve\" hidden>审批申请\u003c/button>\n    \u003c/div>\n    \u003cpre id=\"output\" aria-live=\"polite\">选择主体和申请，然后执行一个动作。\u003c/pre>\n    \u003cp>审批按钮只根据 manager 显示。授权允许之后仍需通过状态、金额与事务检查。数据仅在服务进程内保存，重启服务恢复 B0。\u003c/p>\n  \u003c/main>\n  \u003cscript type=\"module\" src=\"/web/PurchasePage.js\">\u003c/script>\n\u003c/body>\n\u003c/html>\n","lineCount":33,"sha256":"d3cc25a18fcaa753472edfc2f9ac6a6b6c21f030df77aae56a4dc311a057b11e","origin":"example-source"},{"id":"examples/purchase-demo/web/PurchasePage.js","path":"examples/purchase-demo/web/PurchasePage.js","relativePath":"web/PurchasePage.js","project":"purchase-web","language":"js","content":"import { ROLES, USERS, REQUESTS } from '../data/fixtures.js';\nimport { selectDemoSession, submitRequest, approveRequest, readRequest } from './api.js';\n\nconst userSelect = document.querySelector('#user');\nconst requestSelect = document.querySelector('#request');\nconst output = document.querySelector('#output');\nconst approveButton = document.querySelector('#approve');\n\nfor (const user of USERS) {\n  userSelect.add(new Option(`${user.id} · ${user.roles[0]} · ${user.tenant}`, user.id));\n}\nfor (const request of REQUESTS) {\n  requestSelect.add(new Option(\n    `${request.id} · ${request.state} · ${request.amount} 元 · ${request.tenant}`, request.id,\n  ));\n}\n\n// @evidence F.ui.approve:start\nfunction refreshApprovalVisibility() {\n  const user = USERS.find(candidate => candidate.id === userSelect.value);\n  // 可见性只看 manager；租户、所有者、状态、金额全部由后端另行检查。\n  approveButton.hidden = !user.roles.includes(ROLES.manager);\n}\n// @evidence F.ui.approve:end\n\nuserSelect.addEventListener('change', () => {\n  selectDemoSession(userSelect.value);\n  refreshApprovalVisibility();\n});\n\nasync function run(action) {\n  try {\n    output.textContent = JSON.stringify(await action(requestSelect.value), null, 2);\n  } catch (error) {\n    output.textContent = `本地演示请求失败：${error.message}`;\n  }\n}\n\n// @evidence F.ui.actions:start\ndocument.querySelector('#submit').addEventListener('click', () => run(submitRequest));\ndocument.querySelector('#read').addEventListener('click', () => run(readRequest));\napproveButton.addEventListener('click', () => run(approveRequest));\n// @evidence F.ui.actions:end\nrefreshApprovalVisibility();\n","lineCount":45,"sha256":"a2ac0c8dee7995050ab68429da5fe3e2da4a7c5d8ad2ba38f94fcf9f0ec6caec","origin":"example-source"}],"evidence":[{"id":"F.ui.approve","fileId":"examples/purchase-demo/web/PurchasePage.js","startLine":19,"endLine":23,"label":"F.ui.approve","kind":"example-code","sourceType":"示例源码","sha256":"a2ac0c8dee7995050ab68429da5fe3e2da4a7c5d8ad2ba38f94fcf9f0ec6caec","excerpt":"function refreshApprovalVisibility() {\n  const user = USERS.find(candidate => candidate.id === userSelect.value);\n  // 可见性只看 manager；租户、所有者、状态、金额全部由后端另行检查。\n  approveButton.hidden = !user.roles.includes(ROLES.manager);\n}","resultOrigin":"mock"},{"id":"F.ui.actions","fileId":"examples/purchase-demo/web/PurchasePage.js","startLine":40,"endLine":42,"label":"F.ui.actions","kind":"example-code","sourceType":"示例源码","sha256":"a2ac0c8dee7995050ab68429da5fe3e2da4a7c5d8ad2ba38f94fcf9f0ec6caec","excerpt":"document.querySelector('#submit').addEventListener('click', () => run(submitRequest));\ndocument.querySelector('#read').addEventListener('click', () => run(readRequest));\napproveButton.addEventListener('click', () => run(approveRequest));","resultOrigin":"mock"},{"id":"F.client.submit","fileId":"examples/purchase-demo/web/api.js","startLine":17,"endLine":19,"label":"F.client.submit","kind":"example-code","sourceType":"示例源码","sha256":"f5258098701174e34698b9275687e155a94659c7975095df160e01a523fdd796","excerpt":"export function submitRequest(id) {\n  return request('POST', `/requests/${encodeURIComponent(id)}/submit`);\n}","resultOrigin":"mock"},{"id":"F.client.approve","fileId":"examples/purchase-demo/web/api.js","startLine":23,"endLine":25,"label":"F.client.approve","kind":"example-code","sourceType":"示例源码","sha256":"f5258098701174e34698b9275687e155a94659c7975095df160e01a523fdd796","excerpt":"export function approveRequest(id) {\n  return request('POST', `/requests/${encodeURIComponent(id)}/approve`);\n}","resultOrigin":"mock"},{"id":"F.client.read","fileId":"examples/purchase-demo/web/api.js","startLine":29,"endLine":31,"label":"F.client.read","kind":"example-code","sourceType":"示例源码","sha256":"f5258098701174e34698b9275687e155a94659c7975095df160e01a523fdd796","excerpt":"export function readRequest(id) {\n  return request('GET', `/requests/${encodeURIComponent(id)}`);\n}","resultOrigin":"mock"},{"id":"F.audit","fileId":"examples/purchase-demo/server/audit.js","startLine":2,"endLine":12,"label":"F.audit","kind":"example-code","sourceType":"示例源码","sha256":"0ecc56e765ad4b4dfe6ba053fcce49f7d132c8328fd2bd99b1d35f6f3c311937","excerpt":"// 提交与审批共用此函数；审计写入调用者的事务，而非独立提交。\nexport function recordAudit(tx, { action, principal, request }) {\n  tx.appendAudit({\n    action,\n    actor: principal.id,\n    realm: principal.realm,\n    tenant: principal.tenant,\n    requestId: request.id,\n    state: request.state,\n  });\n}","resultOrigin":"mock"},{"id":"F.identity","fileId":"examples/purchase-demo/server/auth.js","startLine":5,"endLine":30,"label":"F.identity","kind":"example-code","sourceType":"示例源码","sha256":"52dd4bb11048b52d9fae3fc4df4120d12e4bbb56402f603b3e5ce6f5ae0f625e","excerpt":"// 合成认证：本地宿主预先建立演示会话。固定 token 可任意选择，不能用于生产。\nexport function createDemoSessions(users = USERS) {\n  return new Map(users.map(user => {\n    const principal = Object.freeze({\n      id: user.id,\n      realm: user.realm,\n      tenant: user.tenant,\n      roles: Object.freeze([...user.roles]),\n      authenticated: true,\n    });\n    return [`demo-${user.id}`, Object.freeze({ principal, mode: 'synthetic-demo' })];\n  }));\n}\n\nexport function establishDemoContext(sessions, sessionToken) {\n  return Object.freeze({ session: sessions.get(sessionToken) ?? null });\n}\n\nexport function authenticate(context) {\n  // 只读取宿主绑定的 session；不接收 body.userId/body.roles/body.tenant。\n  const principal = context.session?.principal;\n  if (!principal?.authenticated || principal.realm !== REALM) {\n    throw new DemoError(401, 'AUTHENTICATION_REQUIRED', '需要有效的合成演示会话');\n  }\n  return principal;\n}","resultOrigin":"mock"},{"id":"F.commit.submit","fileId":"examples/purchase-demo/server/handlers.js","startLine":14,"endLine":18,"label":"F.commit.submit","kind":"example-code","sourceType":"示例源码","sha256":"04f939c304b9c5ae1e4fe4d94f4ca119ed76d29f61eaadee1a1e06baa543c5e3","excerpt":"    const submitted = repository.transaction(tx => {\n      const updated = tx.setState(request.id, 'SUBMITTED');\n      recordAudit(tx, { action: 'request.submit', principal, request: updated });\n      return updated;\n    });","resultOrigin":"mock"},{"id":"F.handler.submit","fileId":"examples/purchase-demo/server/handlers.js","startLine":6,"endLine":24,"label":"F.handler.submit","kind":"example-code","sourceType":"示例源码","sha256":"04f939c304b9c5ae1e4fe4d94f4ca119ed76d29f61eaadee1a1e06baa543c5e3","excerpt":"  function submit(principal, request) {\n    if (request.state !== 'DRAFT') {\n      throw new DemoError(409, 'INVALID_STATE', '只有 DRAFT 申请可以提交');\n    }\n    if (!(request.amount > 0)) {\n      throw new DemoError(422, 'INVALID_AMOUNT', '提交金额必须大于 0 元');\n    }\n    // @evidence F.commit.submit:start\n    const submitted = repository.transaction(tx => {\n      const updated = tx.setState(request.id, 'SUBMITTED');\n      recordAudit(tx, { action: 'request.submit', principal, request: updated });\n      return updated;\n    });\n    // @evidence F.commit.submit:end\n    return {\n      request: submitted,\n      nextCandidates: workflow.candidatesFor('审批人', submitted),\n    };\n  }","resultOrigin":"mock"},{"id":"F.tx.approve","fileId":"examples/purchase-demo/server/handlers.js","startLine":36,"endLine":40,"label":"F.tx.approve","kind":"example-code","sourceType":"示例源码","sha256":"04f939c304b9c5ae1e4fe4d94f4ca119ed76d29f61eaadee1a1e06baa543c5e3","excerpt":"    const approved = repository.transaction(tx => {\n      const updated = tx.setState(request.id, 'APPROVED');\n      recordAudit(tx, { action: 'request.approve', principal, request: updated });\n      return updated;\n    });","resultOrigin":"mock"},{"id":"F.receipt.after-commit","fileId":"examples/purchase-demo/server/handlers.js","startLine":44,"endLine":51,"label":"F.receipt.after-commit","kind":"example-code","sourceType":"示例源码","sha256":"04f939c304b9c5ae1e4fe4d94f4ca119ed76d29f61eaadee1a1e06baa543c5e3","excerpt":"    let receiptStatus = 'sent';\n    try {\n      await receipt.send(approved, receiptTarget);\n    } catch (error) {\n      receipt.recordFailure(approved, error);\n      receiptStatus = 'failed';\n      // 事务已经提交；这里记录回执失败，不回滚 APPROVED 和审计。\n    }","resultOrigin":"mock"},{"id":"F.handler.approve","fileId":"examples/purchase-demo/server/handlers.js","startLine":28,"endLine":58,"label":"F.handler.approve","kind":"example-code","sourceType":"示例源码","sha256":"04f939c304b9c5ae1e4fe4d94f4ca119ed76d29f61eaadee1a1e06baa543c5e3","excerpt":"  async function approve(principal, request, receiptTarget) {\n    if (request.state !== 'SUBMITTED') {\n      throw new DemoError(409, 'INVALID_STATE', '只有 SUBMITTED 申请可以审批');\n    }\n    if (!(request.amount \u003c= 5000)) {\n      throw new DemoError(422, 'AMOUNT_LIMIT', '审批金额不能超过 5000 元');\n    }\n    // @evidence F.tx.approve:start\n    const approved = repository.transaction(tx => {\n      const updated = tx.setState(request.id, 'APPROVED');\n      recordAudit(tx, { action: 'request.approve', principal, request: updated });\n      return updated;\n    });\n    // @evidence F.tx.approve:end\n\n    // @evidence F.receipt.after-commit:start\n    let receiptStatus = 'sent';\n    try {\n      await receipt.send(approved, receiptTarget);\n    } catch (error) {\n      receipt.recordFailure(approved, error);\n      receiptStatus = 'failed';\n      // 事务已经提交；这里记录回执失败，不回滚 APPROVED 和审计。\n    }\n    // @evidence F.receipt.after-commit:end\n    return {\n      request: approved,\n      receipt: { status: receiptStatus, mode: 'simulated' },\n      observerCandidates: workflow.candidatesFor('观察者', approved),\n    };\n  }","resultOrigin":"mock"},{"id":"F.handler.read","fileId":"examples/purchase-demo/server/handlers.js","startLine":62,"endLine":70,"label":"F.handler.read","kind":"example-code","sourceType":"示例源码","sha256":"04f939c304b9c5ae1e4fe4d94f4ca119ed76d29f61eaadee1a1e06baa543c5e3","excerpt":"  function read(principal, request) {\n    // request 由路由按同一 ID 从仓储读取，并已经通过对应读取策略。\n    return {\n      request,\n      viewedBy: principal.id,\n      applicantCandidates: workflow.candidatesFor('申请人', request),\n      observerCandidates: workflow.candidatesFor('观察者', request),\n    };\n  }","resultOrigin":"mock"},{"id":"F.policy.submit","fileId":"examples/purchase-demo/server/policies.js","startLine":12,"endLine":17,"label":"F.policy.submit","kind":"example-code","sourceType":"示例源码","sha256":"4d1ac30cd918453310d610ea4fa984fdbd1138f89f1360d7ebb7b5d546866bf7","excerpt":"export function authorizeSubmit(principal, request) {\n  const allowed = principal.roles.includes(ROLES.employee)\n    && principal.tenant === request.tenant\n    && principal.id === request.owner;\n  requireAllowed(allowed, 'request.submit');\n}","resultOrigin":"mock"},{"id":"F.policy.approve","fileId":"examples/purchase-demo/server/policies.js","startLine":21,"endLine":26,"label":"F.policy.approve","kind":"example-code","sourceType":"示例源码","sha256":"4d1ac30cd918453310d610ea4fa984fdbd1138f89f1360d7ebb7b5d546866bf7","excerpt":"export function authorizeApprove(principal, request) {\n  const allowed = principal.roles.includes(ROLES.manager)\n    && principal.tenant === request.tenant\n    && principal.id !== request.owner;\n  requireAllowed(allowed, 'request.approve');\n}","resultOrigin":"mock"},{"id":"F.policy.read","fileId":"examples/purchase-demo/server/policies.js","startLine":30,"endLine":37,"label":"F.policy.read","kind":"example-code","sourceType":"示例源码","sha256":"4d1ac30cd918453310d610ea4fa984fdbd1138f89f1360d7ebb7b5d546866bf7","excerpt":"export function authorizeRead(principal, request) {\n  const sameTenant = principal.tenant === request.tenant;\n  const ownEmployeeRequest = principal.roles.includes(ROLES.employee)\n    && principal.id === request.owner;\n  const tenantReader = principal.roles.includes(ROLES.manager)\n    || principal.roles.includes(ROLES.readonly);\n  requireAllowed(sameTenant && (ownEmployeeRequest || tenantReader), 'request.read');\n}","resultOrigin":"mock"},{"id":"F.receipt.target","fileId":"examples/purchase-demo/server/receipt.js","startLine":9,"endLine":17,"label":"F.receipt.target","kind":"example-code","sourceType":"示例源码","sha256":"4ca9f105a80240dabf8c6312b9ab29d6452a0f70b66e88a9fe89d378448160b4","excerpt":"    async send(request, runtimeTarget) {\n      // 只写内存以模拟发送，没有邮件、网络或外部通知。\n      if (failNextSend) {\n        failNextSend = false;\n        throw new Error('合成回执发送失败');\n      }\n      // 目的地来自运行时参数；只保存其标签，不验证或访问任何地址。\n      sent.push({ requestId: request.id, state: request.state, target: runtimeTarget, mode: 'simulated' });\n    },","resultOrigin":"mock"},{"id":"F.receipt","fileId":"examples/purchase-demo/server/receipt.js","startLine":2,"endLine":30,"label":"F.receipt","kind":"example-code","sourceType":"示例源码","sha256":"4ca9f105a80240dabf8c6312b9ab29d6452a0f70b66e88a9fe89d378448160b4","excerpt":"export function createReceiptSender() {\n  const sent = [];\n  const failures = [];\n  let failNextSend = false;\n\n  return {\n    // @evidence F.receipt.target:start\n    async send(request, runtimeTarget) {\n      // 只写内存以模拟发送，没有邮件、网络或外部通知。\n      if (failNextSend) {\n        failNextSend = false;\n        throw new Error('合成回执发送失败');\n      }\n      // 目的地来自运行时参数；只保存其标签，不验证或访问任何地址。\n      sent.push({ requestId: request.id, state: request.state, target: runtimeTarget, mode: 'simulated' });\n    },\n    // @evidence F.receipt.target:end\n    recordFailure(request, error) {\n      failures.push({ requestId: request.id, message: error.message });\n    },\n    snapshot: () => structuredClone({ sent, failures }),\n    failNext() { failNextSend = true; },\n    reset() {\n      sent.length = 0;\n      failures.length = 0;\n      failNextSend = false;\n    },\n  };\n}","resultOrigin":"mock"},{"id":"F.repository.get","fileId":"examples/purchase-demo/server/repository.js","startLine":23,"endLine":27,"label":"F.repository.get","kind":"example-code","sourceType":"示例源码","sha256":"51c333700931ec7a7a12c42b5e94e374f157176376fc006314bcc8a96f3d5eb4","excerpt":"  function get(id, from = state) {\n    const request = from.requests[id];\n    if (!request) throw new DemoError(404, 'REQUEST_NOT_FOUND', '申请不存在');\n    return { ...request };\n  }","resultOrigin":"mock"},{"id":"F.repository.transaction","fileId":"examples/purchase-demo/server/repository.js","startLine":31,"endLine":52,"label":"F.repository.transaction","kind":"example-code","sourceType":"示例源码","sha256":"51c333700931ec7a7a12c42b5e94e374f157176376fc006314bcc8a96f3d5eb4","excerpt":"  // 同步内存事务：先在独立副本写入，全部成功后一次替换已提交状态。\n  // 不模拟磁盘耐久性，也不允许回调跨 await，以避免并发副本覆盖。\n  function transaction(work) {\n    const pending = structuredClone(state);\n    const tx = {\n      get: id => get(id, pending),\n      setState(id, nextState) {\n        const request = get(id, pending);\n        pending.requests[id] = { ...request, state: nextState };\n        return get(id, pending);\n      },\n      appendAudit(event) {\n        consumeFailure('audit-write');\n        pending.audits.push({ ...event });\n      },\n    };\n    const result = work(tx);\n    if (result?.then) throw new TypeError('此演示仅支持同步事务回调');\n    consumeFailure('transaction-commit');\n    state = pending;\n    return result;\n  }","resultOrigin":"mock"},{"id":"F.route.submit","fileId":"examples/purchase-demo/server/routes.js","startLine":8,"endLine":16,"label":"F.route.submit","kind":"example-code","sourceType":"示例源码","sha256":"b4e4e20c40ec87ef3a5683fa76ffd0adffec1f79260d92f14cc5d42bd9c787cb","excerpt":"    {\n      method: 'POST', pattern: /^\\/requests\\/([^/]+)\\/submit$/,\n      execute(id, context) {\n        const principal = authenticate(context);\n        const request = repository.get(id);\n        authorizeSubmit(principal, request);\n        return handlers.submit(principal, request);\n      },\n    },","resultOrigin":"mock"},{"id":"F.route.approve","fileId":"examples/purchase-demo/server/routes.js","startLine":19,"endLine":27,"label":"F.route.approve","kind":"example-code","sourceType":"示例源码","sha256":"b4e4e20c40ec87ef3a5683fa76ffd0adffec1f79260d92f14cc5d42bd9c787cb","excerpt":"    {\n      method: 'POST', pattern: /^\\/requests\\/([^/]+)\\/approve$/,\n      execute(id, context) {\n        const principal = authenticate(context);\n        const request = repository.get(id);\n        authorizeApprove(principal, request);\n        return handlers.approve(principal, request, context.receiptTarget);\n      },\n    },","resultOrigin":"mock"},{"id":"F.route.read","fileId":"examples/purchase-demo/server/routes.js","startLine":30,"endLine":38,"label":"F.route.read","kind":"example-code","sourceType":"示例源码","sha256":"b4e4e20c40ec87ef3a5683fa76ffd0adffec1f79260d92f14cc5d42bd9c787cb","excerpt":"    {\n      method: 'GET', pattern: /^\\/requests\\/([^/]+)$/,\n      execute(id, context) {\n        const principal = authenticate(context);\n        const request = repository.get(id);\n        authorizeRead(principal, request);\n        return handlers.read(principal, request);\n      },\n    },","resultOrigin":"mock"},{"id":"F.workflow.load","fileId":"examples/purchase-demo/server/workflow.js","startLine":5,"endLine":10,"label":"F.workflow.load","kind":"example-code","sourceType":"示例源码","sha256":"7ff3fba1fc8ee53975bb63b7514e35360216fa5ed68586734cb1138de04487a5","excerpt":"export function loadWorkflow() {\n  const config = JSON.parse(readFileSync(\n    new URL('../config/workflow.json', import.meta.url), 'utf8',\n  ));\n  return createWorkflow(config);\n}","resultOrigin":"mock"},{"id":"F.workflow.candidates","fileId":"examples/purchase-demo/server/workflow.js","startLine":15,"endLine":23,"label":"F.workflow.candidates","kind":"example-code","sourceType":"示例源码","sha256":"7ff3fba1fc8ee53975bb63b7514e35360216fa5ed68586734cb1138de04487a5","excerpt":"  // 配置参与实际候选人选择；候选身份不额外授予任何后端操作权限。\n  // 原始配置证据还包含 config/workflow.json 全文件。\n  function candidatesFor(actor, request) {\n    const mappedRoles = config.actorBindings[actor] ?? [];\n    return users.filter(user => user.realm === config.realm\n      && user.tenant === request.tenant\n      && user.roles.some(role => mappedRoles.includes(role)))\n      .map(user => user.id);\n  }","resultOrigin":"mock"},{"id":"F.roles","fileId":"examples/purchase-demo/data/fixtures.js","startLine":4,"endLine":16,"label":"F.roles","kind":"example-code","sourceType":"示例源码","sha256":"968ae79b2ecb2613710e27e8e0a611b139d422571b6f703f688bf0a254b2528d","excerpt":"export const ROLES = Object.freeze({\n  employee: `${REALM}:employee`,\n  manager: `${REALM}:manager`,\n  readonly: `${REALM}:readonly`,\n});\n\n// 无角色继承；租户不是角色 ID 的组成部分。\nexport const USERS = Object.freeze([\n  { id: 'u1', realm: REALM, tenant: 'T1', roles: [ROLES.employee] },\n  { id: 'u2', realm: REALM, tenant: 'T1', roles: [ROLES.manager] },\n  { id: 'u3', realm: REALM, tenant: 'T1', roles: [ROLES.readonly] },\n  { id: 'u4', realm: REALM, tenant: 'T2', roles: [ROLES.manager] },\n].map(user => Object.freeze({ ...user, roles: Object.freeze(us
