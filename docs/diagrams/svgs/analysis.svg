<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="analysis-title analysis-desc">
<title id="analysis-title">分析数据流与部分结果 · 设计图解</title>
<desc id="analysis-desc">源码如何成为图，缺输入或分析失败时显示什么？。表达静态分析的信息依赖与结果组织。图中的场景组织和授权绑定不是 worker 必须遵守的串行完成顺序；相同冻结输入下，场景与授权事实的到达次序不得改变最终语义。图不启动目标工程，也不表示其运行流程。</desc>
