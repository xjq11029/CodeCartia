<g class="edge-label"><line x1="730" y1="595" x2="656" y2="585" stroke="#b8c5d4" stroke-width="1" stroke-dasharray="2 3"/><rect x="607" y="573.5" width="98" height="23" rx="4" fill="#fff" fill-opacity=".96"/><text text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="400" fill="#5d728c"><tspan x="656" y="585">附完整性状态</tspan></text></g>
<g class="graph-node" data-node-id="input" tabindex="0" role="button" aria-label="源码／静态配置 语义输入"><title>设计中输入限登记范围，包括已有必要语义元数据和可选文档/测试；独立基准真值不能作为分析输入。依据：设计 §7.3、§9。</title><rect x="40" y="80" width="240" height="90" rx="10" fill="#f0f3f8" stroke="#8a9aaf" stroke-width="1.3"/><rect x="41" y="94" width="3" height="62" rx="1.5" fill="#475b73"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="160" y="112.175">源码／静态配置</tspan><tspan x="160" y="137.825">语义输入</tspan></text></g>
<g class="graph-node" data-node-id="freeze" tabindex="0" role="button" aria-label="冻结输入清单"><title>设计中固定源码、语义输入、配置、分析器、有效规则组合和模式/预算指纹；分析中输入变化须重试或安排下一任务。依据：设计 §8.2。</title><rect x="330" y="80" width="240" height="90" rx="10" fill="#f0f3f8" stroke="#8a9aaf" stroke-width="1.3"/><rect x="331" y="94" width="3" height="62" rx="1.5" fill="#475b73"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="450" y="125">冻结输入清单</tspan></text></g>
<g class="graph-node" data-node-id="discover" tabindex="0" role="button" aria-label="工程发现 与基础索引"><title>设计中识别工程/入口、文件、声明与配置并登记缺失条件；语法索引完成不等于语言深度分析完成。依据：设计 §2.1、§4。</title><rect x="620" y="80" width="240" height="90" rx="10" fill="#eef4ff" stroke="#6082b2" stroke-width="1.3"/><rect x="621" y="94" width="3" height="62" rx="1.5" fill="#31577e"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="740" y="112.175">工程发现</tspan><tspan x="740" y="137.825">与基础索引</tspan></text></g>
<g class="graph-node" data-node-id="semantic" tabindex="0" role="button" aria-label="语义／有限数据流 语言 worker"><title>设计中解析作用域、符号、类型、调用候选及参数/返回摘要；能力握手和支持模式约束传播，缺工具、失败与超时需诊断。依据：设计 §4.2、§5.3、§6.3。</title><rect x="910" y="80" width="240" height="90" rx="10" fill="#eef4ff" stroke="#6082b2" stroke-width="1.3"/><rect x="911" y="94" width="3" height="62" rx="1.5" fill="#31577e"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="1030" y="112.175">语义／有限数据流</tspan><tspan x="1030" y="137.825">语言 worker</tspan></text></g>
<g class="graph-node" data-node-id="framework" tabindex="0" role="button" aria-label="框架事实 与检查点"><title>设计中从语言事实与配置提取路由注册、分发条件、组件、身份、角色、策略及实际挂载；声明与已绑定检查分别保存。依据：设计 §4.2、§6.5、§7.4。</title><rect x="910" y="275" width="240" height="90" rx="10" fill="#eef4ff" stroke="#6082b2" stroke-width="1.3"/><rect x="911" y="289" width="3" height="62" rx="1.5" fill="#31577e"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="1030" y="307.175">框架事实</tspan><tspan x="1030" y="332.825">与检查点</tspan></text></g>
<g class="graph-node" data-node-id="facts" tabindex="0" role="button" aria-label="统一事实 证据与来源"><title>设计中直接接收语言语义事实，并接收框架识别事实，保存实体、关系、候选、调用上下文、条件与逐项证据。框架尚未识别或场景尚未关联时仍可先索引原始事实并诊断；原始事实、解析状态、来源和完整性分开。依据：设计 §4.2、§6.1–6.3、§6.5。</title><rect x="620" y="275" width="240" height="90" rx="10" fill="#f0f3f8" stroke="#8a9aaf" stroke-width="1.3"/><rect x="621" y="289" width="3" height="62" rx="1.5" fill="#475b73"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="740" y="307.175">统一事实</tspan><tspan x="740" y="332.825">证据与来源</tspan></text></g>
<g class="graph-node" data-node-id="links" tabindex="0" role="button" aria-label="跨工程关联 条件化处理链"><title>设计中按请求调用绑定和环境映射生成地址候选，再核对分发语义得到可达处理链；非 HTTP 保留资源空间与协议证据。依据：设计 §7.1–7.2。</title><rect x="330" y="275" width="240" height="90" rx="10" fill="#eef4ff" stroke="#6082b2" stroke-width="1.3"/><rect x="331" y="289" width="3" height="62" rx="1.5" fill="#31577e"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="450" y="307.175">跨工程关联</tspan><tspan x="450" y="332.825">条件化处理链</tspan></text></g>
<g class="graph-node" data-node-id="scenario" tabindex="0" role="button" aria-label="场景／步骤 条件化结构"><title>设计中有据组织入口、动作、对象、规则、状态与异常；共享函数不合并场景，未挂载入口与缺下游保留状态。依据：设计 §6.4、§7.3。</title><rect x="40" y="275" width="240" height="90" rx="10" fill="#eaf7f4" stroke="#60a99b" stroke-width="1.3"/><rect x="41" y="289" width="3" height="62" rx="1.5" fill="#24796d"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="160" y="307.175">场景／步骤</tspan><tspan x="160" y="332.825">条件化结构</tspan></text></g>
<g class="graph-node" data-node-id="binding" tabindex="0" role="button" aria-label="步骤授权关联"><title>设计中将同一入口/主体/动作/对象上的参与者、实际角色、策略、检查链和数据范围绑定到步骤；未关联声明保留，不补造业务。依据：设计 §6.5、§7.4。</title><rect x="40" y="470" width="240" height="90" rx="10" fill="#eaf7f4" stroke="#60a99b" stroke-width="1.3"/><rect x="41" y="484" width="3" height="62" rx="1.5" fill="#24796d"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="160" y="515">步骤授权关联</tspan></text></g>
<g class="graph-node" data-node-id="merge" tabindex="0" role="button" aria-label="合并证据 来源／冲突"><title>设计中原始语言/框架事实可直接合并与索引，不要求先形成业务步骤授权绑定；未识别框架、未关联业务或未解析关系保留证据和诊断。兼容推导保留全部独立依据，不同条件分别保存，冲突和来源按完整依赖链表达。依据：设计 §6.2、§6.5、§13.3.1。</title><rect x="330" y="470" width="240" height="90" rx="10" fill="#eef4ff" stroke="#6082b2" stroke-width="1.3"/><rect x="331" y="484" width="3" height="62" rx="1.5" fill="#31577e"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="450" y="502.175">合并证据</tspan><tspan x="450" y="527.825">来源／冲突</tspan></text></g>
<g class="graph-node" data-node-id="snapshot" tabindex="0" role="button" aria-label="快照／关系 派生结果"><title>设计中写入同一冻结输入版本的原始事实、候选、诊断、场景结构、步骤绑定、逐项证据与完整性。无业务关联的事实和框架未识别的已取得事实仍可索引；中断快照不替换完整结果。依据：设计 §6.5、§8.2。</title><rect x="620" y="470" width="240" height="90" rx="10" fill="#f0f3f8" stroke="#8a9aaf" stroke-width="1.3"/><rect x="621" y="484" width="3" height="62" rx="1.5" fill="#475b73"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="740" y="502.175">快照／关系</tspan><tspan x="740" y="527.825">派生结果</tspan></text></g>
