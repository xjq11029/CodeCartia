<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="navigation-title navigation-desc">
<title id="navigation-title">业务阅读、角色反查与证据导航 · 设计图解</title>
<desc id="navigation-desc">CodeCartia 计划让你从业务步骤看角色和代码，也能从角色或代码返回同一业务上下文。 本图描述 CodeCartia 阅读界面的导航设计，查看顺序不代表业务执行顺序，产品分析验收尚未完成。 表达用户阅读导航设计，箭头表示查看入口和返回关联，不表示目标业务执行。场景详情、授权上下文、角色反查、矩阵与导出必须引用同一组场景/步骤/动作/对象/入口绑定；不会生成与业务脱节的角色功能表。</desc>
<style>text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif} .graph-node{cursor:pointer;outline:none}.graph-node:hover rect,.graph-node:focus rect{stroke-width:3;filter:brightness(.97)} .edge-label{pointer-events:none}</style>
