<g class="edge-label"><rect x="408" y="603.5" width="84" height="23" rx="4" fill="#fff" fill-opacity=".96"/><text text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="400" fill="#5d728c"><tspan x="450" y="615">未关联声明</tspan></text></g>
<g class="edge-label"><rect x="1065" y="403.5" width="70" height="23" rx="4" fill="#fff" fill-opacity=".96"/><text text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="400" fill="#5d728c"><tspan x="1100" y="415">保存依据</tspan></text></g>
<g class="edge-label"><rect x="698" y="573.5" width="84" height="23" rx="4" fill="#fff" fill-opacity=".96"/><text text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="400" fill="#5d728c"><tspan x="740" y="585">同绑定导出</tspan></text></g>
<g class="graph-node" data-node-id="overview" tabindex="0" role="button" aria-label="项目业务总览：先浏览工程有哪些可查看的业务场景，同时了解已知范围和未解析数量。"><title>先浏览工程有哪些可查看的业务场景，同时了解已知范围和未解析数量。
专业说明：设计中的默认入口：列出能力/场景、入口与适用配置、参与者和已知范围；未解析数量及完整性同时显示。依据：设计 §3.4。</title><rect x="40" y="80" width="240" height="90" rx="10" fill="#eaf7f4" stroke="#60a99b" stroke-width="1.3"/><rect x="41" y="94" width="3" height="62" rx="1.5" fill="#24796d"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="160" y="125">项目业务总览</tspan></text></g>
<g class="graph-node" data-node-id="scenario" tabindex="0" role="button" aria-label="场景详情：查看所选业务的目标和步骤，从角色或代码返回时仍保留原入口条件。"><title>查看所选业务的目标和步骤，从角色或代码返回时仍保留原入口条件。
专业说明：设计中查看目标、触发、步骤与异常，从角色或源码返回时仍带相同场景和入口上下文。依据：设计 §3.1、§3.4；AP07。</title><rect x="330" y="80" width="240" height="90" rx="10" fill="#eaf7f4" stroke="#60a99b" stroke-width="1.3"/><rect x="331" y="94" width="3" height="62" rx="1.5" fill="#24796d"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="450" y="125">场景详情</tspan></text></g>
<g class="graph-node" data-node-id="step" tabindex="0" role="button" aria-label="步骤／动作：选中具体动作后，围绕同一对象阅读业务规则、参与角色和授权条件。"><title>选中具体动作后，围绕同一对象阅读业务规则、参与角色和授权条件。
专业说明：设计中选择具体动作与操作对象，查看规则、参与者、角色映射、入口检查点及数据范围。不同动作条件分别保存。依据：设计 §3.4。</title><rect x="620" y="80" width="240" height="90" rx="10" fill="#eaf7f4" stroke="#60a99b" stroke-width="1.3"/><rect x="621" y="94" width="3" height="62" rx="1.5" fill="#24796d"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="740" y="125">步骤／动作</tspan></text></g>
<g class="graph-node" data-node-id="object" tabindex="0" role="button" aria-label="业务对象／规则 状态／异常：在当前动作里查看处理对象、业务校验、状态变化和异常，不把授权等同成功。"><title>在当前动作里查看处理对象、业务校验、状态变化和异常，不把授权等同成功。
专业说明：设计中解释当前步骤对谁做什么、满足哪些业务规则、状态何时写入与如何失败；授权与业务成功分离。依据：设计 §6.4–6.5。</title><rect x="910" y="80" width="240" height="90" rx="10" fill="#eaf7f4" stroke="#60a99b" stroke-width="1.3"/><rect x="911" y="94" width="3" height="62" rx="1.5" fill="#24796d"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="1030" y="112.175">业务对象／规则</tspan><tspan x="1030" y="137.825">状态／异常</tspan></text></g>
<g class="graph-node" data-node-id="system" tabindex="0" role="button" aria-label="系统／模块视图：从应用和服务进入模块、文件，与业务关系相互跳转，继续追踪实现位置。"><title>从应用和服务进入模块、文件，与业务关系相互跳转，继续追踪实现位置。
专业说明：设计中可从整体应用/服务进入模块与文件，再深入符号；与业务视图共享有据关系，允许继续追踪实现。依据：设计 §3.3。</title><rect x="40" y="275" width="240" height="90" rx="10" fill="#eef4ff" stroke="#6082b2" stroke-width="1.3"/><rect x="41" y="289" width="3" height="62" rx="1.5" fill="#31577e"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="160" y="320">系统／模块视图</tspan></text></g>
<g class="graph-node" data-node-id="symbol" tabindex="0" role="button" aria-label="符号／调用查询：查找函数及调用关系，也能反查相关场景；共享函数不意味着业务场景相同。"><title>查找函数及调用关系，也能反查相关场景；共享函数不意味着业务场景相同。
专业说明：设计中查看调用候选及双方位置；共享函数可反查多个有依据的场景，不因连通而合并场景。依据：设计 §3.3、§6.3；BS04-P1。</title><rect x="330" y="275" width="240" height="90" rx="10" fill="#eef4ff" stroke="#6082b2" stroke-width="1.3"/><rect x="331" y="289" width="3" height="62" rx="1.5" fill="#31577e"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="450" y="320">符号／调用查询</tspan></text></g>
<g class="graph-node" data-node-id="context" tabindex="0" role="button" aria-label="当前步骤 授权上下文：保留当前步骤的入口、主体、对象和授权条件，让详情与角色反查指向同一关系。"><title>保留当前步骤的入口、主体、对象和授权条件，让详情与角色反查指向同一关系。
专业说明：设计中保留入口、身份域、主体、对象、角色、实际策略/检查链、UI 可见、认证、数据范围、条件和未知；反查和详情使用同一绑定。依据：设计 §3.4、§7.4；AP07。</title><rect x="620" y="275" width="240" height="90" rx="10" fill="#eaf7f4" stroke="#60a99b" stroke-width="1.3"/><rect x="621" y="289" width="3" height="62" rx="1.5" fill="#24796d"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="740" y="307.175">当前步骤</tspan><tspan x="740" y="332.825">授权上下文</tspan></text></g>
<g class="graph-node" data-node-id="evidence" tabindex="0" role="button" aria-label="依据面板 源码／配置：展开每项说明的源码、配置和推导依据，核对后可带着原上下文返回步骤。"><title>展开每项说明的源码、配置和推导依据，核对后可带着原上下文返回步骤。
专业说明：设计中对每项说明展示直接支持与反对证据、双方位置、推导、配置/快照和缺口；可据场景/步骤标识返回原上下文。依据：设计 §3.2、§6.2；BS04。</title><rect x="910" y="275" width="240" height="90" rx="10" fill="#f0f3f8" stroke="#8a9aaf" stroke-width="1.3"/><rect x="911" y="289" width="3" height="62" rx="1.5" fill="#475b73"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="1030" y="307.175">依据面板</tspan><tspan x="1030" y="332.825">源码／配置</tspan></text></g>
<g class="graph-node" data-node-id="role" tabindex="0" role="button" aria-label="角色／权限反查：从角色或权限找出关联的场景和动作，再分别查看各动作的条件与数据范围。"><title>从角色或权限找出关联的场景和动作，再分别查看各动作的条件与数据范围。
专业说明：设计中查询可复用角色/权限关联的场景、动作与对象，不跨场景合并允许条件；结果回到原步骤。依据：设计 §3.4；AP07-P1/P2。</title><rect x="40" y="470" width="240" height="90" rx="10" fill="#eef4ff" stroke="#6082b2" stroke-width="1.3"/><rect x="41" y="484" width="3" height="62" rx="1.5" fill="#31577e"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="160" y="515">角色／权限反查</tspan></text></g>
<g class="graph-node" data-node-id="matrix" tabindex="0" role="button" aria-label="步骤条件矩阵：像对照表一样比较各步骤的认证、授权和业务条件，不把角色能力简化成无条件勾选。"><title>像对照表一样比较各步骤的认证、授权和业务条件，不把角色能力简化成无条件勾选。
专业说明：设计中每行是场景/步骤/动作/对象，按角色或主体比较；单元格保存入口、认证、后端授权、UI 可见、数据与业务前置条件。依据：设计 §3.4；AP07。</title><rect x="330" y="470" width="240" height="90" rx="10" fill="#eaf7f4" stroke="#60a99b" stroke-width="1.3"/><rect x="331" y="484" width="3" height="62" rx="1.5" fill="#24796d"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="450" y="515">步骤条件矩阵</tspan></text></g>
<g class="graph-node" data-node-id="diagnosis" tabindex="0" role="button" aria-label="未关联／未知 诊断入口：集中查看未关联声明、未知检查和其他缺口，避免把没发现检查当作允许访问。"><title>集中查看未关联声明、未知检查和其他缺口，避免把没发现检查当作允许访问。
专业说明：设计中保留尚未绑定业务的声明及证据、缺口；未发现检查、未绑定、未解析、不适用与显式匿名分别显示，不补造场景。依据：设计 §3.4、§7.4；AP07-N3。</title><rect x="620" y="470" width="240" height="90" rx="10" fill="#fff6e8" stroke="#d6ab6a" stroke-width="1.3"/><rect x="621" y="484" width="3" height="62" rx="1.5" fill="#a87931"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="740" y="502.175">未关联／未知</tspan><tspan x="740" y="527.825">诊断入口</tspan></text></g>
<g class="graph-node" data-node-id="export" tabindex="0" role="button" aria-label="保存／导出 快照与条件：保存或分享当前视图时带上快照、条件和来源，移除源码后也要说明缺失内容。"><title>保存或分享当前视图时带上快照、条件和来源，移除源码后也要说明缺失内容。
专业说明：设计中保存视图与注释，导出同一语义结果；保留回到场景/步骤的 ID、身份域、配置、来源与未知/过期，分享移除源码后标明缺失。依据：设计 §3.1、§8.4；AP07-N2。</title><rect x="910" y="470" width="240" height="90" rx="10" fill="#eef4ff" stroke="#6082b2" stroke-width="1.3"/><rect x="911" y="484" width="3" height="62" rx="1.5" fill="#31577e"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="1030" y="502.175">保存／导出</tspan><tspan x="1030" y="527.825">快照与条件</tspan></text></g>
<text text-anchor="start" dominant-baseline="central" font-size="13" font-weight="400" fill="#788ba1"><tspan x="24" y="743">设计 v0.6 · 初版验证 JS/TS、Python · 尚未实现 · 箭头含义以本章节说明为准</tspan></text>
</svg>