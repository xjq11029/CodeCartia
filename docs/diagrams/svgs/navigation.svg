<g class="edge-label"><line x1="305" y1="515" x2="305" y2="442" stroke="#b8c5d4" stroke-width="1" stroke-dasharray="2 3"/><rect x="263" y="430.5" width="84" height="23" rx="4" fill="#fff" fill-opacity=".96"/><text text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="400" fill="#5d728c"><tspan x="305" y="442">同绑定比较</tspan></text></g>
