<g class="edge-label"><line x1="885" y1="125" x2="979" y2="204" stroke="#b8c5d4" stroke-width="1" stroke-dasharray="2 3"/><rect x="944" y="192.5" width="70" height="23" rx="4" fill="#fff" fill-opacity=".96"/><text text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="400" fill="#5d728c"><tspan x="979" y="204">辅助说明</tspan></text></g>
<g class="graph-node" data-node-id="business_roots" tabindex="0" role="button" aria-label="登记业务源码根"><title>设计中按允许范围只读扫描业务源码、静态配置及明确选入的文档/测试。业务索引默认排除依赖、日志、媒体、上传数据、凭据等。依据：设计 §9。</title><rect x="40" y="80" width="240" height="90" rx="10" fill="#f0f3f8" stroke="#8a9aaf" stroke-width="1.3"/><rect x="41" y="94" width="3" height="62" rx="1.5" fill="#475b73"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="160" y="125">登记业务源码根</tspan></text></g>
<g class="graph-node" data-node-id="semantic_roots" tabindex="0" role="button" aria-label="登记语义输入根"><title>设计中只读加载必要 SDK、类型定义、程序集、系统头文件、存根和已有生成输入；工作区外输入需明确登记、来源可核验，解析路径与符号链接仍在登记根内。依据：设计 §9。</title><rect x="40" y="275" width="240" height="90" rx="10" fill="#f0f3f8" stroke="#8a9aaf" stroke-width="1.3"/><rect x="41" y="289" width="3" height="62" rx="1.5" fill="#475b73"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="160" y="320">登记语义输入根</tspan></text></g>
<g class="graph-node" data-node-id="workspace_config" tabindex="0" role="button" aria-label="工作区／环境 输入清单"><title>设计中分别登记业务根、语义根、选定工程/环境/配置及规范化路径、来源和指纹；缺失或未登记输入诊断，不自动扩大范围。依据：设计 §8.2、§9。</title><rect x="40" y="470" width="240" height="90" rx="10" fill="#f0f3f8" stroke="#8a9aaf" stroke-width="1.3"/><rect x="41" y="484" width="3" height="62" rx="1.5" fill="#475b73"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="160" y="502.175">工作区／环境</tspan><tspan x="160" y="527.825">输入清单</tspan></text></g>
<g class="graph-node" data-node-id="cli" tabindex="0" role="button" aria-label="CLI 编排进程"><title>设计中管理发现、分析任务与快照；按工程检查相关工具，调度独立语言 worker。任务带快照/配置 ID，版本不兼容明确报错。依据：设计 §4.2、§8.1。</title><rect x="330" y="80" width="240" height="90" rx="10" fill="#eef4ff" stroke="#6082b2" stroke-width="1.3"/><rect x="331" y="94" width="3" height="62" rx="1.5" fill="#31577e"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="450" y="125">CLI 编排进程</tspan></text></g>
<g class="graph-node" data-node-id="workers" tabindex="0" role="button" aria-label="语言分析 独立 worker"><title>设计中按目标语言提取语义与有限数据流。Java/C#/C/C++ 等使用独立进程；协议包含能力、分批事实、诊断、取消、超时与完整性，日志独立。依据：设计 §4.1–4.2。</title><rect x="330" y="275" width="240" height="90" rx="10" fill="#eef4ff" stroke="#6082b2" stroke-width="1.3"/><rect x="331" y="289" width="3" height="62" rx="1.5" fill="#31577e"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="450" y="307.175">语言分析</tspan><tspan x="450" y="332.825">独立 worker</tspan></text></g>
<g class="graph-node" data-node-id="adapters" tabindex="0" role="button" aria-label="框架／协议 适配器"><title>设计中分别识别组件、路由注册/分发、DI、请求、资源关联、身份/角色/策略及实际检查绑定；不能仅凭名字确定授权或执行链。依据：设计 §4.2、§7。</title><rect x="330" y="470" width="240" height="90" rx="10" fill="#eef4ff" stroke="#6082b2" stroke-width="1.3"/><rect x="331" y="484" width="3" height="62" rx="1.5" fill="#31577e"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="450" y="502.175">框架／协议</tspan><tspan x="450" y="527.825">适配器</tspan></text></g>
<g class="graph-node" data-node-id="ai" tabindex="0" role="button" aria-label="可选 AI 适配"><title>设计中解释选定证据、提出未解析线索与候选规则；输入范围可查看，默认不发送整仓库。云端方案与费用尚未决定。关闭 AI 不影响静态阅读。依据：设计 §8.3；D11。</title><rect x="620" y="80" width="240" height="90" rx="10" fill="#f4effb" stroke="#ac93c5" stroke-width="1.3" stroke-dasharray="6 4"/><rect x="621" y="94" width="3" height="62" rx="1.5" fill="#80619f"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="740" y="125">可选 AI 适配</tspan></text></g>
<g class="graph-node" data-node-id="facts" tabindex="0" role="button" aria-label="统一事实 与证据模型"><title>设计中保存稳定实体、原始语言/框架事实、候选、调用上下文、条件、来源链、证据和完整性。未识别框架或未关联场景的事实仍可先索引并报告缺口，不以场景/授权绑定为保存前提；自动、AI、人工与运行观察分别标记。依据：设计 §6.1–6.3、§6.5。</title><rect x="620" y="275" width="240" height="90" rx="10" fill="#f0f3f8" stroke="#8a9aaf" stroke-width="1.3"/><rect x="621" y="289" width="3" height="62" rx="1.5" fill="#475b73"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="740" y="307.175">统一事实</tspan><tspan x="740" y="332.825">与证据模型</tspan></text></g>
<g class="graph-node" data-node-id="business_layer" tabindex="0" role="button" aria-label="业务语义层 步骤授权绑定"><title>设计中组织场景、步骤、动作与对象，并有据绑定参与者/角色、策略、检查链和数据范围。技术事实可先到达，缺关联保留诊断。依据：设计 §6.4–6.5、§7.3–7.4。</title><rect x="620" y="470" width="240" height="90" rx="10" fill="#eaf7f4" stroke="#60a99b" stroke-width="1.3"/><rect x="621" y="484" width="3" height="62" rx="1.5" fill="#24796d"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="740" y="502.175">业务语义层</tspan><tspan x="740" y="527.825">步骤授权绑定</tspan></text></g>
<g class="graph-node" data-node-id="store" tabindex="0" role="button" aria-label="快照索引 与关系存储"><title>设计中分别持久化冻结输入上的原始事实、候选、诊断、关联、业务派生结果与依赖；原始事实可直接保存，不要求先形成场景或步骤授权绑定。中断结果不能替换完整快照，旧注释与历史快照保留。依据：设计 §4、§6.5、§8.2。</title><rect x="620" y="635" width="240" height="80" rx="10" fill="#f0f3f8" stroke="#8a9aaf" stroke-width="1.3"/><rect x="621" y="649" width="3" height="52" rx="1.5" fill="#475b73"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="740" y="662.175">快照索引</tspan><tspan x="740" y="687.825">与关系存储</tspan></text></g>
<g class="graph-node" data-node-id="web" tabindex="0" role="button" aria-label="本地 Web 阅读界面"><title>设计中展示场景步骤、角色反查、条件矩阵、关系图与证据。目标工程文本不获执行权限；技术细节放依据面板。依据：设计 §3、§9.1。</title><rect x="910" y="80" width="240" height="90" rx="10" fill="#eef4ff" stroke="#6082b2" stroke-width="1.3"/><rect x="911" y="94" width="3" height="62" rx="1.5" fill="#31577e"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="1030" y="112.175">本地 Web</tspan><tspan x="1030" y="137.825">阅读界面</tspan></text></g>
<g class="graph-node" data-node-id="session" tabindex="0" role="button" aria-label="会话／访问 与渲染边界"><title>设计中回环绑定、Host/Origin 校验、会话鉴权和跨站防护；Web 通用文件接口限业务根，外部语义内容仅经登记证据 ID 受限提供。HTML/SVG 等按上下文安全输出。依据：设计 §9–9.1。</title><rect x="910" y="275" width="240" height="90" rx="10" fill="#fff6e8" stroke="#d6ab6a" stroke-width="1.3"/><rect x="911" y="289" width="3" height="62" rx="1.5" fill="#a87931"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="1030" y="307.175">会话／访问</tspan><tspan x="1030" y="332.825">与渲染边界</tspan></text></g>
<g class="graph-node" data-node-id="export" tabindex="0" role="button" aria-label="设计中的导出"><title>设计中导出关系 JSON、Markdown/Mermaid、SVG/PNG 与交互 HTML；保留条件、快照、来源和缺口，可移除源码但保留证据 ID。不携带本地会话凭据或自动连接能力。依据：设计 §8.4、§9.1。</title><rect x="910" y="470" width="240" height="90" rx="10" fill="#eef4ff" stroke="#6082b2" stroke-width="1.3"/><rect x="911" y="484" width="3" height="62" rx="1.5" fill="#31577e"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="1030" y="515">设计中的导出</tspan></text></g>
