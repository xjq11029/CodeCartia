<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="architecture-title architecture-desc">
<title id="architecture-title">组件、进程与读取边界 · 设计图解</title>
<desc id="architecture-desc">哪些组件协作，谁可以读取哪些输入？。表达组件职责、进程关系和读取边界；节点均为设计组件。语言 worker 的工具实现、存储、Web 与布局框架均未锁定。箭头表示数据或接口依赖，不承诺具体部署拓扑、线程数或严格执行顺序。</desc>
<style>text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif} .graph-node{cursor:pointer;outline:none}.graph-node:hover rect,.graph-node:focus rect{stroke-width:3;filter:brightness(.97)} .edge-label{pointer-events:none}</style>
