<g class="edge-label"><rect x="210" y="583.5" width="70" height="23" rx="4" fill="#fff" fill-opacity=".96"/><text text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="400" fill="#5d728c"><tspan x="245" y="595">独立条件</tspan></text></g>
<g class="edge-label"><rect x="471" y="583.5" width="98" height="23" rx="4" fill="#fff" fill-opacity=".96"/><text text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="400" fill="#5d728c"><tspan x="520" y="595">保留原始实体</tspan></text></g>
<g class="graph-node" data-node-id="scenario" tabindex="0" role="button" aria-label="业务场景：表示一个有依据的业务目标，关联它的入口、步骤、输入和输出。"><title>表示一个有依据的业务目标，关联它的入口、步骤、输入和输出。
专业说明：设计实体：稳定 ID、业务目标及依据、入口、工程/环境/配置、输入输出与完整性。同目标多入口可有据归并，入口条件分别保存。依据：设计 §6.4。</title><rect x="40" y="80" width="240" height="90" rx="10" fill="#eaf7f4" stroke="#60a99b" stroke-width="1.3"/><rect x="41" y="94" width="3" height="62" rx="1.5" fill="#24796d"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="160" y="125">业务场景</tspan></text></g>
<g class="graph-node" data-node-id="step" tabindex="0" role="button" aria-label="场景步骤：表示场景中的一个环节，把相关动作、对象、参与者和条件放在一起解释。"><title>表示场景中的一个环节，把相关动作、对象、参与者和条件放在一起解释。
专业说明：设计实体：场景与入口上下文、动作、对象绑定、前置规则、参与者、授权、分支/异步及异常出口。步骤展示同一组关系。依据：设计 §6.4。</title><rect x="330" y="80" width="240" height="90" rx="10" fill="#eaf7f4" stroke="#60a99b" stroke-width="1.3"/><rect x="331" y="94" width="3" height="62" rx="1.5" fill="#24796d"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="450" y="125">场景步骤</tspan></text></g>
<g class="graph-node" data-node-id="action" tabindex="0" role="button" aria-label="业务动作：表示读取、修改或审批等具体操作；使用同一权限的不同动作仍分别记录。"><title>表示读取、修改或审批等具体操作；使用同一权限的不同动作仍分别记录。
专业说明：设计中的动作身份与目标对象分别登记；列表、详情、修改、审批等不因引用同一角色或权限就合并为一个动作。依据：设计 §6.4；AP07-P3。</title><rect x="620" y="80" width="240" height="90" rx="10" fill="#eaf7f4" stroke="#60a99b" stroke-width="1.3"/><rect x="621" y="94" width="3" height="62" rx="1.5" fill="#24796d"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="740" y="125">业务动作</tspan></text></g>
<g class="graph-node" data-node-id="object" tabindex="0" role="button" aria-label="业务对象 状态／值版本：表示动作处理的业务数据，并区分读取和写入的状态、对象及值版本。"><title>表示动作处理的业务数据，并区分读取和写入的状态、对象及值版本。
专业说明：设计中对象 ID 与读写值版本绑定到动作；读 A 写 B 不组成 A 的状态转换，赋值、提交路径与真实运行提交分开。依据：设计 §6.4；BS02。</title><rect x="910" y="80" width="240" height="90" rx="10" fill="#f0f3f8" stroke="#8a9aaf" stroke-width="1.3"/><rect x="911" y="94" width="3" height="62" rx="1.5" fill="#475b73"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="1030" y="112.175">业务对象</tspan><tspan x="1030" y="137.825">状态／值版本</tspan></text></g>
<g class="graph-node" data-node-id="actor" tabindex="0" role="button" aria-label="业务参与者：申请人、审批人等业务称谓；需要有依据才能映射到系统中的主体或角色。"><title>申请人、审批人等业务称谓；需要有依据才能映射到系统中的主体或角色。
专业说明：设计实体：申请人、审批人、任务/系统等业务称谓及类型；与实际主体或角色的映射有明确来源，可多对多。依据：设计 §6.4–6.5；B0 §2.1。</title><rect x="40" y="275" width="240" height="90" rx="10" fill="#eaf7f4" stroke="#60a99b" stroke-width="1.3"/><rect x="41" y="289" width="3" height="62" rx="1.5" fill="#24796d"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="160" y="320">业务参与者</tspan></text></g>
<g class="graph-node" data-node-id="binding" tabindex="0" role="button" aria-label="步骤授权绑定：像一张上下文关联卡，把当前动作、对象、身份和实际授权检查连在一起。"><title>像一张上下文关联卡，把当前动作、对象、身份和实际授权检查连在一起。
专业说明：设计关系：保存场景/步骤/动作、对象与数据范围、主体/角色、入口/调用/配置、实际策略、检查链、条件、证据与业务关联状态；判定状态另存。依据：设计 §6.4–6.5。</title><rect x="330" y="275" width="240" height="90" rx="10" fill="#eef4ff" stroke="#6082b2" stroke-width="1.3"/><rect x="331" y="289" width="3" height="62" rx="1.5" fill="#31577e"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="450" y="320">步骤授权绑定</tspan></text></g>
<g class="graph-node" data-node-id="rule" tabindex="0" role="button" aria-label="业务规则 状态操作：说明业务本身的校验、计算和状态操作，例如审批金额限制及失败出口。"><title>说明业务本身的校验、计算和状态操作，例如审批金额限制及失败出口。
专业说明：设计实体：条件/计算、对象字段、前后状态、执行/写入/事务位置与未解析边界；按实际作用区别业务校验和授权条件。依据：设计 §6.4–6.5。</title><rect x="620" y="275" width="240" height="90" rx="10" fill="#eaf7f4" stroke="#60a99b" stroke-width="1.3"/><rect x="621" y="289" width="3" height="62" rx="1.5" fill="#24796d"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="740" y="307.175">业务规则</tspan><tspan x="740" y="332.825">状态操作</tspan></text></g>
<g class="graph-node" data-node-id="evidence" tabindex="0" role="button" aria-label="实现与 逐项证据：把每个结论连到直接支持或反对它的代码、配置和来源，方便逐项核对。"><title>把每个结论连到直接支持或反对它的代码、配置和来源，方便逐项核对。
专业说明：设计中每个结论关联支持/反对证据、源码/配置位置、快照、条件及完整来源链；一组报告引用不能代替逐项支持。依据：设计 §6.2、§6.4。</title><rect x="910" y="275" width="240" height="90" rx="10" fill="#f0f3f8" stroke="#8a9aaf" stroke-width="1.3"/><rect x="911" y="289" width="3" height="62" rx="1.5" fill="#475b73"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="1030" y="307.175">实现与</tspan><tspan x="1030" y="332.825">逐项证据</tspan></text></g>
<g class="graph-node" data-node-id="subject" tabindex="0" role="button" aria-label="主体／身份 与资源关系：表示执行动作的用户、服务或委托身份，并保留身份来源和相关属性。"><title>表示执行动作的用户、服务或委托身份，并保留身份来源和相关属性。
专业说明：设计实体：用户、服务或委托主体，记录身份域、取得/转换、声明属性；不要求真实账号清单。属性策略可无角色运行。依据：设计 §6.5、§7.4。</title><rect x="40" y="470" width="240" height="90" rx="10" fill="#f0f3f8" stroke="#8a9aaf" stroke-width="1.3"/><rect x="41" y="484" width="3" height="62" rx="1.5" fill="#475b73"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="160" y="502.175">主体／身份</tspan><tspan x="160" y="527.825">与资源关系</tspan></text></g>
<g class="graph-node" data-node-id="role" tabindex="0" role="button" aria-label="系统角色 身份域：表示某个身份范围内的系统角色，可被多个场景引用，同名角色不自动合并。"><title>表示某个身份范围内的系统角色，可被多个场景引用，同名角色不自动合并。
专业说明：设计实体：角色 ID 含身份域，声明、授予/继承和条件有据保存；一个角色可用于多个场景，一位参与者可映射多个角色。依据：设计 §6.5；B0、BS01。</title><rect x="330" y="470" width="240" height="90" rx="10" fill="#f0f3f8" stroke="#8a9aaf" stroke-width="1.3"/><rect x="331" y="484" width="3" height="62" rx="1.5" fill="#475b73"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="450" y="502.175">系统角色</tspan><tspan x="450" y="527.825">身份域</tspan></text></g>
<g class="graph-node" data-node-id="policy" tabindex="0" role="button" aria-label="权限／策略 独立共享实体：分别记录权限标识和判定策略，可供多个动作引用，但各动作的条件仍独立保留。"><title>分别记录权限标识和判定策略，可供多个动作引用，但各动作的条件仍独立保留。
专业说明：设计实体类别：权限原标识与策略表达式、效果、组合/顺序/默认、版本、作用资源及支持状态分别保存；可被多动作引用。依据：设计 §6.5；AP07-P3。</title><rect x="620" y="470" width="240" height="90" rx="10" fill="#f0f3f8" stroke="#8a9aaf" stroke-width="1.3"/><rect x="621" y="484" width="3" height="62" rx="1.5" fill="#475b73"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="740" y="502.175">权限／策略</tspan><tspan x="740" y="527.825">独立共享实体</tspan></text></g>
<g class="graph-node" data-node-id="checkpoint" tabindex="0" role="button" aria-label="实际检查点 入口／路径：表示代码中真正挂载并适用的检查位置；只有策略声明还不能证明检查生效。"><title>表示代码中真正挂载并适用的检查位置；只有策略声明还不能证明检查生效。
