<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="model-title model-desc">
<title id="model-title">场景、步骤与授权实体关系 · 设计图解</title>
<desc id="model-desc">CodeCartia 计划用一套共享关系，把业务动作、操作对象、参与角色和授权条件连在一起。 本图描述 CodeCartia 的信息模型设计，概念关系尚未通过产品分析验收。 表达概念关系与查询结构，箭头不表示解析先后或目标工程运行顺序。场景、步骤、动作、对象、主体、角色、权限、策略及检查点有独立身份；步骤授权绑定连接它们，角色反查与条件矩阵复用同一绑定。</desc>
<style>text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif} .graph-node{cursor:pointer;outline:none}.graph-node:hover rect,.graph-node:focus rect{stroke-width:3;filter:brightness(.97)} .edge-label{pointer-events:none}</style>
