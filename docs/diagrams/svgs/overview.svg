<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="overview-title overview-desc">
<title id="overview-title">产品阅读全景 · 设计图解</title>
<desc id="overview-desc">从哪里读起，角色与源码放在哪里？。表达设计中的阅读入口与信息组织关系，不表示分析器执行顺序，也不表示目标工程的真实执行轨迹。默认从业务总览进入场景，再逐步看动作、对象、规则和授权；架构及符号视图帮助追溯实现。</desc>
<style>text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif} .graph-node{cursor:pointer;outline:none}.graph-node:hover rect,.graph-node:focus rect{stroke-width:3;filter:brightness(.97)} .edge-label{pointer-events:none}</style>
