<g class="edge-label"><line x1="885" y1="515" x2="885" y2="442" stroke="#b8c5d4" stroke-width="1" stroke-dasharray="2 3"/><rect x="850" y="430.5" width="70" height="23" rx="4" fill="#fff" fill-opacity=".96"/><text text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="400" fill="#5d728c"><tspan x="885" y="442">条件依据</tspan></text></g>
<g class="graph-node" data-node-id="workspace" tabindex="0" role="button" aria-label="多工程工作区"><title>设计入口：登记一个或多个工程与选定环境，查看识别、输入缺失与结果完整性。依据：设计 §3.1、§3.2。</title><rect x="40" y="80" width="240" height="90" rx="10" fill="#f0f3f8" stroke="#8a9aaf" stroke-width="1.3"/><rect x="41" y="94" width="3" height="62" rx="1.5" fill="#475b73"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="160" y="125">多工程工作区</tspan></text></g>
<g class="graph-node" data-node-id="business" tabindex="0" role="button" aria-label="业务总览"><title>设计中的默认业务入口：能力与场景目录、入口、适用配置、参与者及已知实现范围。尚未识别到业务不等于项目没有业务。依据：设计 §3.4。</title><rect x="330" y="80" width="240" height="90" rx="10" fill="#eaf7f4" stroke="#60a99b" stroke-width="1.3"/><rect x="331" y="94" width="3" height="62" rx="1.5" fill="#24796d"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="450" y="125">业务总览</tspan></text></g>
<g class="graph-node" data-node-id="scenario" tabindex="0" role="button" aria-label="场景详情"><title>设计中展示目标、触发、输入与输出；同一目标的不同入口需要有据归并，入口条件仍分别保留。依据：设计 §3.4、§6.4。</title><rect x="620" y="80" width="240" height="90" rx="10" fill="#eaf7f4" stroke="#60a99b" stroke-width="1.3"/><rect x="621" y="94" width="3" height="62" rx="1.5" fill="#24796d"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="740" y="125">场景详情</tspan></text></g>
<g class="graph-node" data-node-id="step" tabindex="0" role="button" aria-label="步骤／动作"><title>设计中逐步解释动作、对象、业务规则、状态与异常；每步直接附参与者、角色映射和授权上下文。依据：设计 §3.4。</title><rect x="910" y="80" width="240" height="90" rx="10" fill="#eaf7f4" stroke="#60a99b" stroke-width="1.3"/><rect x="911" y="94" width="3" height="62" rx="1.5" fill="#24796d"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="1030" y="125">步骤／动作</tspan></text></g>
<g class="graph-node" data-node-id="system" tabindex="0" role="button" aria-label="系统总览"><title>设计中的架构入口：应用、服务、进程、数据库、消息与外部资源；从同一工作区进入。依据：设计 §3.3。</title><rect x="40" y="275" width="240" height="90" rx="10" fill="#eef4ff" stroke="#6082b2" stroke-width="1.3"/><rect x="41" y="289" width="3" height="62" rx="1.5" fill="#31577e"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="160" y="320">系统总览</tspan></text></g>
<g class="graph-node" data-node-id="chain" tabindex="0" role="button" aria-label="跨工程关系"><title>设计中关联请求、端点、处理逻辑和数据资源；HTTP 地址候选与条件化可达处理链分别保存。依据：设计 §3.3、§7.1、§7.2。</title><rect x="330" y="275" width="240" height="90" rx="10" fill="#eef4ff" stroke="#6082b2" stroke-width="1.3"/><rect x="331" y="289" width="3" height="62" rx="1.5" fill="#31577e"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="450" y="320">跨工程关系</tspan></text></g>
<g class="graph-node" data-node-id="roles" tabindex="0" role="button" aria-label="步骤内角色 与授权"><title>设计中在当前动作解释参与者、实际角色、主体、策略、检查链及数据范围；角色可跨场景复用，条件逐绑定保存。依据：设计 §3.4、§6.5。</title><rect x="620" y="275" width="240" height="90" rx="10" fill="#eaf7f4" stroke="#60a99b" stroke-width="1.3"/><rect x="621" y="289" width="3" height="62" rx="1.5" fill="#24796d"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="740" y="307.175">步骤内角色</tspan><tspan x="740" y="332.825">与授权</tspan></text></g>
<g class="graph-node" data-node-id="object" tabindex="0" role="button" aria-label="对象／规则 状态／异常"><title>设计中业务规则与授权条件分别表达；状态读写必须绑定同一对象和值版本，授权通过不证明业务成功。依据：设计 §6.4、§6.5。</title><rect x="910" y="275" width="240" height="90" rx="10" fill="#eaf7f4" stroke="#60a99b" stroke-width="1.3"/><rect x="911" y="289" width="3" height="62" rx="1.5" fill="#24796d"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="1030" y="307.175">对象／规则</tspan><tspan x="1030" y="332.825">状态／异常</tspan></text></g>
<g class="graph-node" data-node-id="modules" tabindex="0" role="button" aria-label="模块与文件"><title>设计中查看模块依赖、文件引用、边界与循环，用于定位阅读和修改位置。依据：设计 §3.3。</title><rect x="40" y="470" width="240" height="90" rx="10" fill="#eef4ff" stroke="#6082b2" stroke-width="1.3"/><rect x="41" y="484" width="3" height="62" rx="1.5" fill="#31577e"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="160" y="515">模块与文件</tspan></text></g>
<g class="graph-node" data-node-id="symbols" tabindex="0" role="button" aria-label="符号与调用"><title>设计中深入类、函数、方法、引用与调用候选；静态候选不等于实际运行目标。依据：设计 §3.3、§6.2。</title><rect x="330" y="470" width="240" height="90" rx="10" fill="#eef4ff" stroke="#6082b2" stroke-width="1.3"/><rect x="331" y="484" width="3" height="62" rx="1.5" fill="#31577e"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="450" y="515">符号与调用</tspan></text></g>
<g class="graph-node" data-node-id="matrix" tabindex="0" role="button" aria-label="条件矩阵 角色反查"><title>设计中从同一组步骤绑定生成矩阵和角色反查；保留入口、动作、对象、认证、数据范围与未知，不生成无条件能力清单。依据：设计 §3.4。</title><rect x="620" y="470" width="240" height="90" rx="10" fill="#eaf7f4" stroke="#60a99b" stroke-width="1.3"/><rect x="621" y="484" width="3" height="62" rx="1.5" fill="#24796d"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="740" y="502.175">条件矩阵</tspan><tspan x="740" y="527.825">角色反查</tspan></text></g>
<g class="graph-node" data-node-id="evidence" tabindex="0" role="button" aria-label="逐项实现依据"><title>设计中查看支持与反对证据、两侧源码位置、配置与推导、来源及缺口；业务含义与运行观察分别表达。依据：设计 §3.2、§6.2。</title><rect x="910" y="470" width="240" height="90" rx="10" fill="#f0f3f8" stroke="#8a9aaf" stroke-width="1.3"/><rect x="911" y="484" width="3" height="62" rx="1.5" fill="#475b73"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="1030" y="515">逐项实现依据</tspan></text></g>
<text text-anchor="start" dominant-baseline="central" font-size="13" font-weight="400" fill="#788ba1"><tspan x="24" y="743">设计 v0.6 · 尚未实现 · 箭头含义以本章节说明为准</tspan></text>
</svg>