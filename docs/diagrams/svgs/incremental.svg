<g class="graph-node" data-node-id="current" tabindex="0" role="button" aria-label="完整快照 保存视图：记录当前完整结果及其输入版本，保存的阅读视图仍指向这份快照。"><title>记录当前完整结果及其输入版本，保存的阅读视图仍指向这份快照。
专业说明：设计中保存当前完整分析快照、输入/规则组合指纹和用户视图；视图绑定快照，注释独立保存。依据：设计 §8.2。</title><rect x="40" y="80" width="240" height="90" rx="10" fill="#f0f3f8" stroke="#8a9aaf" stroke-width="1.3"/><rect x="41" y="94" width="3" height="62" rx="1.5" fill="#475b73"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="160" y="112.175">完整快照</tspan><tspan x="160" y="137.825">保存视图</tspan></text></g>
<g class="graph-node" data-node-id="change" tabindex="0" role="button" aria-label="源码／输入／配置 规则组合变化：代码、辅助输入、路由、身份配置或识别规则变化，都可能影响旧分析结论。"><title>代码、辅助输入、路由、身份配置或识别规则变化，都可能影响旧分析结论。
专业说明：设计中源码增删移、必要输入补齐、路由集合/顺序、策略/身份/租户/文档、规则启停/覆盖都会触发依赖检查。依据：设计 §8.2、§13.6。</title><rect x="330" y="80" width="240" height="90" rx="10" fill="#eef4ff" stroke="#6082b2" stroke-width="1.3"/><rect x="331" y="94" width="3" height="62" rx="1.5" fill="#31577e"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="450" y="112.175">源码／输入／配置</tspan><tspan x="450" y="137.825">规则组合变化</tspan></text></g>
<g class="graph-node" data-node-id="freeze" tabindex="0" role="button" aria-label="冻结新输入 与有效组合：为下一次分析固定新的文件和规则组合，防止结果混用不同版本的输入。"><title>为下一次分析固定新的文件和规则组合，防止结果混用不同版本的输入。
专业说明：设计中固定源码、语义输入、配置、分析器、有效规则组合、业务/授权模式与预算；AI 解释另记模型/提示及证据指纹。依据：设计 §8.2。</title><rect x="620" y="80" width="240" height="90" rx="10" fill="#f0f3f8" stroke="#8a9aaf" stroke-width="1.3"/><rect x="621" y="94" width="3" height="62" rx="1.5" fill="#475b73"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="740" y="112.175">冻结新输入</tspan><tspan x="740" y="137.825">与有效组合</tspan></text></g>
<g class="graph-node" data-node-id="queries" tabindex="0" role="button" aria-label="查询／集合依赖 成功与失败：记录查询查过什么范围、有哪些候选；查找失败也可能因后续新增内容而改变。"><title>记录查询查过什么范围、有哪些候选；查找失败也可能因后续新增内容而改变。
专业说明：设计中模块/符号/端点/资源查询登记键、搜索范围、配置、优先级与结果指纹；目录、导出、路由、依赖/生成输入与资源映射集合也登记。依据：设计 §8.2。</title><rect x="910" y="80" width="240" height="90" rx="10" fill="#f0f3f8" stroke="#8a9aaf" stroke-width="1.3"/><rect x="911" y="94" width="3" height="62" rx="1.5" fill="#475b73"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="1030" y="112.175">查询／集合依赖</tspan><tspan x="1030" y="137.825">成功与失败</tspan></text></g>
<g class="graph-node" data-node-id="invalidate" tabindex="0" role="button" aria-label="直接＋传递失效：沿依赖找出直接和间接受影响的结果，让相关场景、反查和说明一起过期。"><title>沿依赖找出直接和间接受影响的结果，让相关场景、反查和说明一起过期。
专业说明：设计中沿查询、集合、事实、摘要、跨工程关联、场景归属与步骤授权依赖传播；解释和反查/矩阵同步失效，范围不明则扩大重建。依据：设计 §8.2。</title><rect x="910" y="275" width="240" height="90" rx="10" fill="#fff6e8" stroke="#d6ab6a" stroke-width="1.3"/><rect x="911" y="289" width="3" height="62" rx="1.5" fill="#a87931"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="1030" y="320">直接＋传递失效</tspan></text></g>
<g class="graph-node" data-node-id="stale" tabindex="0" role="button" aria-label="旧结果标过期：提醒读者旧说明尚未按新代码核对，更新完成前不能当作当前工程依据。"><title>提醒读者旧说明尚未按新代码核对，更新完成前不能当作当前工程依据。
专业说明：设计中旧场景、金额规则、授权判定、矩阵与问答先显示过期；更新完成前旧源码位置不作为当前依据，不能只换快照标签。依据：设计 §8.2；BS04-N2、AP06-P2/P3。</title><rect x="620" y="275" width="240" height="90" rx="10" fill="#fff6e8" stroke="#d6ab6a" stroke-width="1.3"/><rect x="621" y="289" width="3" height="62" rx="1.5" fill="#a87931"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="740" y="320">旧结果标过期</tspan></text></g>
<g class="graph-node" data-node-id="recompute" tabindex="0" role="button" aria-label="重算受影响范围：按新版本重算受影响部分；范围无法确定时扩大到相关工程或全量重建。"><title>按新版本重算受影响部分；范围无法确定时扩大到相关工程或全量重建。
专业说明：设计中按新冻结输入重新运行相关分析；包含旧未解析查询、新候选集合、身份/策略/分发及步骤绑定。不精确时扩大到相关工程或全量。依据：设计 §8.2。</title><rect x="330" y="275" width="240" height="90" rx="10" fill="#eef4ff" stroke="#6082b2" stroke-width="1.3"/><rect x="331" y="289" width="3" height="62" rx="1.5" fill="#31577e"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="450" y="320">重算受影响范围</tspan></text></g>
<g class="graph-node" data-node-id="merge" tabindex="0" role="button" aria-label="重合并独立证据 共享实体保留：重新汇集仍有效的独立依据；其他场景仍支持的角色和策略不会随一条关系一起删除。"><title>重新汇集仍有效的独立依据；其他场景仍支持的角色和策略不会随一条关系一起删除。
专业说明：设计中撤去受影响推导后由剩余规则/证据重合并；仍被其他场景引用的角色/策略/审计保留，失去业务关联的声明保留诊断。依据：设计 §8.2、§13.6；BS04-P2、AP06-N2。</title><rect x="40" y="275" width="240" height="90" rx="10" fill="#eef4ff" stroke="#6082b2" stroke-width="1.3"/><rect x="41" y="289" width="3" height="62" rx="1.5" fill="#31577e"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="160" y="307.175">重合并独立证据</tspan><tspan x="160" y="332.825">共享实体保留</tspan></text></g>
<g class="graph-node" data-node-id="compare" tabindex="0" role="button" aria-label="验收／回归对照 增量＝全量：在验收和回归中比较同输入的增量与全量结果，不是每次更新都必须执行的任务。"><title>在验收和回归中比较同输入的增量与全量结果，不是每次更新都必须执行的任务。
专业说明：设计中的验收／回归旁路：在同输入、配置、分析器、有效组合与预算下，执行增量与全量重建并比较实体、关系、证据、候选、条件、来源、场景/绑定、反查与诊断，只忽略无语义字段，保留对照依据与差异报告。正常增量发布不要求每次再执行全量重建；等价性作为实现契约由验收与回归验证。依据：设计 §8.2；AP06。</title><rect x="40" y="470" width="240" height="90" rx="10" fill="#eef4ff" stroke="#6082b2" stroke-width="1.3"/><rect x="41" y="484" width="3" height="62" rx="1.5" fill="#31577e"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="160" y="502.175">验收／回归对照</tspan><tspan x="160" y="527.825">增量＝全量</tspan></text></g>
<g class="graph-node" data-node-id="publish" tabindex="0" role="button" aria-label="新的完整快照：相关重算和合并完成后发布同一输入版本的完整快照，中断结果不能替换它。"><title>相关重算和合并完成后发布同一输入版本的完整快照，中断结果不能替换它。
专业说明：设计中正常增量任务完成受影响范围重建及证据合并后，仅发布同一冻结输入版本的完整快照；中断或混合输入结果不得替换当前完整结果。每次正常发布不必额外全量重建，增量／全量等价契约通过独立验收和回归对照验证；当前尚无实测。依据：设计 §8.2；AP06。</title><rect x="330" y="470" width="240" height="90" rx="10" fill="#f0f3f8" stroke="#8a9aaf" stroke-width="1.3"/><rect x="331" y="484" width="3" height="62" rx="1.5" fill="#475b73"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="450" y="515">新的完整快照</tspan></text></g>
<g class="graph-node" data-node-id="views" tabindex="0" role="button" aria-label="主视图／反查 矩阵／解释更新：根据更新后的同一组步骤关系同步刷新场景、角色反查、条件矩阵和解释。"><title>根据更新后的同一组步骤关系同步刷新场景、角色反查、条件矩阵和解释。
专业说明：设计中同一组步骤绑定驱动场景、角色反查、矩阵与导出，绑定/条件/入口变化时同步更新；人工与 AI 解释保留独立来源。依据：设计 §8.2；AP07。</title><rect x="620" y="470" width="240" height="90" rx="10" fill="#eaf7f4" stroke="#60a99b" stroke-width="1.3"/><rect x="621" y="484" width="3" height="62" rx="1.5" fill="#24796d"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="740" y="502.175">主视图／反查</tspan><tspan x="740" y="527.825">矩阵／解释更新</tspan></text></g>
<g class="graph-node" data-node-id="history" tabindex="0" role="button" aria-label="旧快照／注释 历史可回看：保留旧快照和注释，方便回看当时依据，同时明确它们属于历史版本。"><title>保留旧快照和注释，方便回看当时依据，同时明确它们属于历史版本。
专业说明：设计中保留旧输入与规则版本、历史依据和人工注释；历史视图仍绑定旧快照，不冒充当前源码。依据：设计 §8.2、§13.6。</title><rect x="910" y="470" width="240" height="90" rx="10" fill="#f0f3f8" stroke="#8a9aaf" stroke-width="1.3"/><rect x="911" y="484" width="3" height="62" rx="1.5" fill="#475b73"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="1030" y="502.175">旧快照／注释</tspan><tspan x="1030" y="527.825">历史可回看</tspan></text></g>
<g class="graph-node" data-node-id="incomplete" tabindex="0" role="button" aria-label="中断／对照失败 保留诊断：分析中断时保留完整旧结果；验收对照失败时保存差异和诊断，等待修正复测。"><title>分析中断时保留完整旧结果；验收对照失败时保存差异和诊断，等待修正复测。
专业说明：设计中正常增量分析中断或超限时不替换当前完整结果；验收／回归对照不等价时保留差异、来源与诊断，受测结果不能声明通过，修正后复测。对照任务不是每次正常发布的必经步骤。依据：设计 §8.2 的完整性及等价要求；AP06。</title><rect x="330" y="635" width="240" height="80" rx="10" fill="#fff6e8" stroke="#d6ab6a" stroke-width="1.3"/><rect x="331" y="649" width="3" height="52" rx="1.5" fill="#a87931"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="450" y="662.175">中断／对照失败</tspan><tspan x="450" y="687.825">保留诊断</tspan></text></g>
