专业说明：设计中发现输入变化时重试，或纳入下一任务；不能发布混合源码与语义输入版本的完整快照。依据：设计 §8.2。</title><rect x="620" y="635" width="240" height="80" rx="10" fill="#fff6e8" stroke="#d6ab6a" stroke-width="1.3"/><rect x="621" y="649" width="3" height="52" rx="1.5" fill="#a87931"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="740" y="662.175">分析期间输入变</tspan><tspan x="740" y="687.825">重试或下一任务</tspan></text></g>
