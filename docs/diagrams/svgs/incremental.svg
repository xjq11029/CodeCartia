<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="incremental-title incremental-desc">
<title id="incremental-title">快照失效、增量更新与历史保留 · 设计图解</title>
<desc id="incremental-desc">代码或配置变化后，CodeCartia 计划更新受影响的分析结果，标记过期内容，并保留历史快照。 本图描述 CodeCartia 的快照更新设计，增量与全量等价尚未通过产品分析验收。 表达设计中的分析快照更新过程。变化来自源码、语义输入、路由顺序、身份/策略配置或有效识别规则组合；原始事实、步骤绑定、角色反查、矩阵和解释沿依赖失效。正常增量重建受影响范围并发布同一冻结输入版本的完整快照；同输入增量／全量等价对照通过验收和回归旁路验证契约，不作为每次增量发布必须执行的全量任务。当前完整结果与历史快照分别维护。</desc>
