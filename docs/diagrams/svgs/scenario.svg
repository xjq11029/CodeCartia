<g class="edge-label"><rect x="185" y="583.5" width="70" height="23" rx="4" fill="#fff" fill-opacity=".96"/><text text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="400" fill="#5d728c"><tspan x="220" y="595">发送失败</tspan></text></g>
<g class="graph-node" data-node-id="entry" tabindex="0" role="button" aria-label="审批入口"><title>B0 入口 POST /requests/{id}/approve 实际绑定认证与审批授权；检查覆盖此入口与动作，不能套用到其他入口。逻辑证据：F.route.approve（样例 §2.1）。</title><rect x="40" y="80" width="240" height="90" rx="10" fill="#eaf7f4" stroke="#60a99b" stroke-width="1.3"/><rect x="41" y="94" width="3" height="62" rx="1.5" fill="#24796d"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="160" y="125">审批入口</tspan></text></g>
<g class="graph-node" data-node-id="identity" tabindex="0" role="button" aria-label="已认证身份 u2 / T1"><title>B0 路由要求已认证；u2 属于 realm-purchase，角色 manager，租户 T1。身份来自绑定认证上下文，不来自请求体自报。逻辑证据：F.identity、F.roles、F.route.approve（§2.1–2.2）。</title><rect x="330" y="80" width="240" height="90" rx="10" fill="#f0f3f8" stroke="#8a9aaf" stroke-width="1.3"/><rect x="331" y="94" width="3" height="62" rx="1.5" fill="#475b73"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="450" y="112.175">已认证身份</tspan><tspan x="450" y="137.825">u2 / T1</tspan></text></g>
<g class="graph-node" data-node-id="object" tabindex="0" role="button" aria-label="绑定同一申请 r2 / owner:u1"><title>B0 指定 r2 的对象身份、owner:u1、tenant:T1、state:SUBMITTED、amount:1000；后续授权、校验、状态和提交引用同一对象/值版本。逻辑证据：B0 对象表、F.handler.approve；BS02。</title><rect x="620" y="80" width="240" height="90" rx="10" fill="#f0f3f8" stroke="#8a9aaf" stroke-width="1.3"/><rect x="621" y="94" width="3" height="62" rx="1.5" fill="#475b73"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="740" y="112.175">绑定同一申请</tspan><tspan x="740" y="137.825">r2 / owner:u1</tspan></text></g>
<g class="graph-node" data-node-id="auth" tabindex="0" role="button" aria-label="manager 授权 同租户／非本人"><title>B0 的 request.approve 授权要求当前主体具有本身份域 manager、与申请同租户且非申请所有者；u2/r2 条件满足时允许。角色/租户/非所有者在此属于授权。逻辑证据：F.policy.approve、F.route.approve（§2.2）。</title><rect x="910" y="80" width="240" height="90" rx="10" fill="#eaf7f4" stroke="#60a99b" stroke-width="1.3"/><rect x="911" y="94" width="3" height="62" rx="1.5" fill="#24796d"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="1030" y="112.175">manager 授权</tspan><tspan x="1030" y="137.825">同租户／非本人</tspan></text></g>
<g class="graph-node" data-node-id="state" tabindex="0" role="button" aria-label="业务状态校验 SUBMITTED"><title>B0 审批业务校验要求同一申请当前状态为 SUBMITTED；不满足返回状态错误，不进入状态写入。此状态要求按 B0 实现属于业务前置规则。逻辑证据：F.handler.approve（§2.2）。</title><rect x="910" y="275" width="240" height="90" rx="10" fill="#eaf7f4" stroke="#60a99b" stroke-width="1.3"/><rect x="911" y="289" width="3" height="62" rx="1.5" fill="#24796d"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="1030" y="307.175">业务状态校验</tspan><tspan x="1030" y="332.825">SUBMITTED</tspan></text></g>
<g class="graph-node" data-node-id="amount" tabindex="0" role="button" aria-label="业务金额校验 金额 ≤ 5000"><title>B0 审批金额门槛为测试指定的 5000 元；金额超限返回金额限制错误，而不是没有 request.approve 权限。r2=1000 可通过，r3=6000 对照失败。逻辑证据：F.handler.approve；BS02-P2。</title><rect x="620" y="275" width="240" height="90" rx="10" fill="#eaf7f4" stroke="#60a99b" stroke-width="1.3"/><rect x="621" y="289" width="3" height="62" rx="1.5" fill="#24796d"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="740" y="307.175">业务金额校验</tspan><tspan x="740" y="332.825">金额 ≤ 5000</tspan></text></g>
<g class="graph-node" data-node-id="transaction" tabindex="0" role="button" aria-label="显式事务 状态＋审计"><title>B0 在显式事务内更新同一对象为 APPROVED 并写审计记录；赋值或仓储调用本身不证明持久成功，审计共享实现不导致场景合并。逻辑证据：F.tx.approve、F.audit；BS01、BS02。</title><rect x="330" y="275" width="240" height="90" rx="10" fill="#eaf7f4" stroke="#60a99b" stroke-width="1.3"/><rect x="331" y="289" width="3" height="62" rx="1.5" fill="#24796d"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="450" y="307.175">显式事务</tspan><tspan x="450" y="332.825">状态＋审计</tspan></text></g>
<g class="graph-node" data-node-id="commit" tabindex="0" role="button" aria-label="事务提交成功 审批已持久化"><title>仅在角色/数据授权与业务条件满足且事务提交成功的代码路径，r2 由 SUBMITTED 变为 APPROVED，审计随事务提交。不是运行中实际提交观察。逻辑证据：F.tx.approve；BS02-P1。</title><rect x="40" y="275" width="240" height="90" rx="10" fill="#eaf7f4" stroke="#60a99b" stroke-width="1.3"/><rect x="41" y="289" width="3" height="62" rx="1.5" fill="#24796d"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="160" y="307.175">事务提交成功</tspan><tspan x="160" y="332.825">审批已持久化</tspan></text></g>
<g class="graph-node" data-node-id="receipt" tabindex="0" role="button" aria-label="提交后 调用回执发送"><title>B0 明确事务提交后调用回执发送；属于已提交后的外部作用，不将发送调用本身当作实际送达。逻辑证据：F.receipt、F.tx.approve（§2.2）；BS02。</title><rect x="40" y="470" width="240" height="90" rx="10" fill="#eaf7f4" stroke="#60a99b" stroke-width="1.3"/><rect x="41" y="484" width="3" height="62" rx="1.5" fill="#24796d"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="160" y="502.175">提交后</tspan><tspan x="160" y="527.825">调用回执发送</tspan></text></g>
<g class="graph-node" data-node-id="receipt_ok" tabindex="0" role="button" aria-label="回执调用 成功返回分支"><title>表示 B0 中回执调用成功返回的代码分支，审批此前已提交。缺少运行证据时不宣称真实用户已收到回执或线上业务实际发生。逻辑证据：F.receipt；§2.2、BS02 与 BS03-N2。</title><rect x="330" y="470" width="240" height="90" rx="10" fill="#eaf7f4" stroke="#60a99b" stroke-width="1.3"/><rect x="331" y="484" width="3" height="62" rx="1.5" fill="#24796d"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="450" y="502.175">回执调用</tspan><tspan x="450" y="527.825">成功返回分支</tspan></text></g>
<g class="graph-node" data-node-id="auth_failure" tabindex="0" role="button" aria-label="授权拒绝 终止审批动作"><title>任一 B0 审批授权条件不满足时不进入业务审批路径：其他角色、跨租户或审批自己的申请均不由 manager 名称绕过。必要检查缺证据则应未知，不能用拒绝替代未知。逻辑证据：F.policy.approve；AP01、AP03。</title><rect x="620" y="470" width="240" height="90" rx="10" fill="#fff6e8" stroke="#d6ab6a" stroke-width="1.3"/><rect x="621" y="484" width="3" height="62" rx="1.5" fill="#a87931"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="740" y="502.175">授权拒绝</tspan><tspan x="740" y="527.825">终止审批动作</tspan></text></g>
<g class="graph-node" data-node-id="business_failure" tabindex="0" role="button" aria-label="业务校验失败 无状态写入"><title>状态非 SUBMITTED 或金额大于 5000 时输出对应业务错误，审批写入不发生；授权可能已允许，不将金额/状态错误混成授权拒绝。逻辑证据：F.handler.approve；BS02-P2。</title><rect x="910" y="470" width="240" height="90" rx="10" fill="#fff6e8" stroke="#d6ab6a" stroke-width="1.3"/><rect x="911" y="484" width="3" height="62" rx="1.5" fill="#a87931"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="1030" y="502.175">业务校验失败</tspan><tspan x="1030" y="527.825">无状态写入</tspan></text></g>
<g class="graph-node" data-node-id="receipt_failure" tabindex="0" role="button" aria-label="记录回执失败 审批不回滚"><title>B0 回执发送失败被捕获并记录，已成功提交的审批仍保留 APPROVED 与审计；不能仅凭 catch 推断补偿、重试或通知成功。逻辑证据：F.receipt；BS02-N1。</title><rect x="40" y="635" width="240" height="80" rx="10" fill="#fff6e8" stroke="#d6ab6a" stroke-width="1.3"/><rect x="41" y="649" width="3" height="52" rx="1.5" fill="#a87931"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="160" y="662.175">记录回执失败</tspan><tspan x="160" y="687.825">审批不回滚</tspan></text></g>
<g class="graph-node" data-node-id="commit_failure" tabindex="0" role="button" aria-label="事务提交失败 不报持久成功"><title>B0 的提交失败路径不能报告 r2 已持久批准；只有提交成功证据支持成功状态，不从异常捕获另行推断已完成补偿或重试。逻辑证据：F.tx.approve；BS02-N1。</title><rect x="330" y="635" width="240" height="80" rx="10" fill="#fff6e8" stroke="#d6ab6a" stroke-width="1.3"/><rect x="331" y="649" width="3" height="52" rx="1.5" fill="#a87931"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="450" y="662.175">事务提交失败</tspan><tspan x="450" y="687.825">不报持久成功</tspan></text></g>
<text text-anchor="start" dominant-baseline="central" font-size="13" font-weight="400" fill="#788ba1"><tspan x="24" y="743">设计 v0.6 · 尚未实现 · 箭头含义以本章节说明为准</tspan></text>
</svg>