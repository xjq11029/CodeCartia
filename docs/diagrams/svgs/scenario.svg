<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="scenario-title scenario-desc">
<title id="scenario-title">合成采购审批：授权、业务与提交 · 设计图解</title>
<desc id="scenario-desc">manager 能审批什么，金额超限或回执失败意味着什么？。表达验收样例 B0 中源码/配置应支持的条件路径。示例指定已认证 u2=manager/T1 处理同一对象 r2=(owner:u1, tenant:T1, state:SUBMITTED, amount:1000)，并展开拒绝、业务失败、提交失败与回执失败。它不是已存在源码、实际账号或线上执行记录；对象绑定节点表示后续检查使用同一已取得对象，不承诺未规定的数据库读取时机。</desc>
<style>text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif} .graph-node{cursor:pointer;outline:none}.graph-node:hover rect,.graph-node:focus rect{stroke-width:3;filter:brightness(.97)} .edge-label{pointer-events:none}</style>
