<g class="graph-node" data-node-id="feedback" tabindex="0" role="button" aria-label="新项目错连 漏连／未解析：记录发现的错连、漏连或未解析线索，附上源码依据，反馈本身仍需核对。"><title>记录发现的错连、漏连或未解析线索，附上源码依据，反馈本身仍需核对。
专业说明：设计中保存问题类型、关系 ID、快照/配置、适配器版本、期望与理由及源码/配置证据；反馈本身不是已确认真值。依据：设计 §13.2。</title><rect x="40" y="80" width="240" height="90" rx="10" fill="#f0f3f8" stroke="#8a9aaf" stroke-width="1.3"/><rect x="41" y="94" width="3" height="62" rx="1.5" fill="#475b73"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="160" y="112.175">新项目错连</tspan><tspan x="160" y="137.825">漏连／未解析</tspan></text></g>
<g class="graph-node" data-node-id="triage" tabindex="0" role="button" aria-label="根因分类 补必要上下文：先判断问题来自缺输入、分析错误还是动态行为，避免用新规则掩盖环境缺口。"><title>先判断问题来自缺输入、分析错误还是动态行为，避免用新规则掩盖环境缺口。
专业说明：设计中区分缺构建环境、解析/绑定/框架/协议错误与真实动态行为；缺环境优先补必要输入，不能用规则掩盖缺失。依据：设计 §13.2。</title><rect x="330" y="80" width="240" height="90" rx="10" fill="#eef4ff" stroke="#6082b2" stroke-width="1.3"/><rect x="331" y="94" width="3" height="62" rx="1.5" fill="#31577e"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="450" y="112.175">根因分类</tspan><tspan x="450" y="137.825">补必要上下文</tspan></text></g>
<g class="graph-node" data-node-id="candidate" tabindex="0" role="button" aria-label="AI 候选规则 模式＋前提＋反例：AI 可提出识别模式、前提和反例；这些只是候选建议，不能直接当作正确规则。"><title>AI 可提出识别模式、前提和反例；这些只是候选建议，不能直接当作正确规则。
专业说明：设计中 AI 从允许证据归纳语言/框架/版本、模式、必要条件、受限候选与反例及可复现样例；AI 自评不证明正确。依据：设计 §13.2–13.3。</title><rect x="620" y="80" width="240" height="90" rx="10" fill="#f4effb" stroke="#ac93c5" stroke-width="1.3" stroke-dasharray="6 4"/><rect x="621" y="94" width="3" height="62" rx="1.5" fill="#80619f"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="740" y="112.175">AI 候选规则</tspan><tspan x="740" y="137.825">模式＋前提＋反例</tspan></text></g>
<g class="graph-node" data-node-id="verify" tabindex="0" role="button" aria-label="源码／语义 配置核对：独立核对源码、符号和配置是否支持候选，确认反馈预期有足够依据。"><title>独立核对源码、符号和配置是否支持候选，确认反馈预期有足够依据。
专业说明：设计中独立核对位置、符号、传播、注册、实际绑定与证据；反馈和 AI 期望经独立核对后才能成为基准标注。依据：设计 §13.2。</title><rect x="910" y="80" width="240" height="90" rx="10" fill="#eef4ff" stroke="#6082b2" stroke-width="1.3"/><rect x="911" y="94" width="3" height="62" rx="1.5" fill="#31577e"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="1030" y="112.175">源码／语义</tspan><tspan x="1030" y="137.825">配置核对</tspan></text></g>
<g class="graph-node" data-node-id="trial" tabindex="0" role="button" aria-label="项目内试运行 新旧自动副本：在相同输入上比较新旧自动分析副本，候选结果不会直接覆盖正式代码地图。"><title>在相同输入上比较新旧自动分析副本，候选结果不会直接覆盖正式代码地图。
专业说明：设计中新旧规则在相同冻结输入/基准上各重建自动副本，关闭分析时 AI 与人工覆盖；候选副本不直接覆盖正式图。依据：设计 §13.2 第 5 项。</title><rect x="910" y="275" width="240" height="90" rx="10" fill="#eef4ff" stroke="#6082b2" stroke-width="1.3"/><rect x="911" y="289" width="3" height="62" rx="1.5" fill="#31577e"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="1030" y="307.175">项目内试运行</tspan><tspan x="1030" y="332.825">新旧自动副本</tspan></text></g>
<g class="graph-node" data-node-id="independent" tabindex="0" role="button" aria-label="独立项目验证 家族隔离：用未参与规则生成和调参的独立项目验证，复制仓库或相同模板不算独立样本。"><title>用未参与规则生成和调参的独立项目验证，复制仓库或相同模板不算独立样本。
专业说明：设计中在未参与生成/调参的项目验证泛化及同类反例，重复仓库/模板归入同家族；保留源码与标注不进入生成上下文。依据：设计 §13.4。</title><rect x="620" y="275" width="240" height="90" rx="10" fill="#eef4ff" stroke="#6082b2" stroke-width="1.3"/><rect x="621" y="289" width="3" height="62" rx="1.5" fill="#31577e"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="740" y="307.175">独立项目验证</tspan><tspan x="740" y="332.825">家族隔离</tspan></text></g>
<g class="graph-node" data-node-id="regression" tabindex="0" role="button" aria-label="冻结基准回归 受影响分项：用冻结基准复查受影响能力，确认候选没有带来新的错连、遗漏或条件错误。"><title>用冻结基准复查受影响能力，确认候选没有带来新的错连、遗漏或条件错误。
专业说明：设计中对语言/框架、统一图协议、链路及受影响业务/授权分项分别回归，按实际启用组合比较错连、遗漏、候选与条件。门槛待冻结。依据：设计 §13.2、§13.6、§10.5。</title><rect x="330" y="275" width="240" height="90" rx="10" fill="#eef4ff" stroke="#6082b2" stroke-width="1.3"/><rect x="331" y="289" width="3" height="62" rx="1.5" fill="#31577e"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="450" y="307.175">冻结基准回归</tspan><tspan x="450" y="332.825">受影响分项</tspan></text></g>
<g class="graph-node" data-node-id="review" tabindex="0" role="button" aria-label="维护者审查 适用范围：由维护者核对适用范围和验证报告，再决定作为项目专用规则还是推广使用。"><title>由维护者核对适用范围和验证报告，再决定作为项目专用规则还是推广使用。
专业说明：设计中通过独立验证及回归后审查推广；依赖特定命名或目录的规则先保留项目专用，不能无提示影响其他工程。依据：设计 §13.2、§13.3。</title><rect x="40" y="275" width="240" height="90" rx="10" fill="#eef4ff" stroke="#6082b2" stroke-width="1.3"/><rect x="41" y="289" width="3" height="62" rx="1.5" fill="#31577e"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="160" y="307.175">维护者审查</tspan><tspan x="160" y="332.825">适用范围</tspan></text></g>
<g class="graph-node" data-node-id="package" tabindex="0" role="button" aria-label="不可变版本 规则包：把已审查规则保存为有固定版本和指纹的规则包，连同依赖与验证报告留档。"><title>把已审查规则保存为有固定版本和指纹的规则包，连同依赖与验证报告留档。
专业说明：设计中规则包记录版本、内容指纹、适用范围、父版本、依赖、兼容性及验证报告；模型/提示生成记录与旧快照保留。依据：设计 §13.3、§13.6。</title><rect x="40" y="470" width="240" height="90" rx="10" fill="#f0f3f8" stroke="#8a9aaf" stroke-width="1.3"/><rect x="41" y="484" width="3" height="62" rx="1.5" fill="#475b73"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="160" y="502.175">不可变版本</tspan><tspan x="160" y="527.825">规则包</tspan></text></g>
<g class="graph-node" data-node-id="effective" tabindex="0" role="button" aria-label="冻结有效组合 启用／覆盖／依赖：记录本次真正启用的规则、依赖和显式覆盖，确保分析结果可重现并保留冲突。"><title>记录本次真正启用的规则、依赖和显式覆盖，确保分析结果可重现并保留冲突。
专业说明：设计中记录包/规则、启用、优先级、显式覆盖、依赖/阶段和解释器版本；组合指纹进入来源与缓存。冲突不能仅用优先级消解。依据：设计 §13.3.1。</title><rect x="330" y="470" width="240" height="90" rx="10" fill="#eef4ff" stroke="#6082b2" stroke-width="1.3"/><rect x="331" y="484" width="3" height="62" rx="1.5" fill="#31577e"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="450" y="502.175">冻结有效组合</tspan><tspan x="450" y="527.825">启用／覆盖／依赖</tspan></text></g>
<g class="graph-node" data-node-id="new_project" tabindex="0" role="button" aria-label="另一新项目 自动分析复测：在另一个独立工程自动复测固化规则，验证推广效果；运行规则不必再调用 AI。"><title>在另一个独立工程自动复测固化规则，验证推广效果；运行规则不必再调用 AI。
专业说明：设计中已验证固化规则可在不调用 AI 时运行并另记质量；首版须证明完整闭环至另一独立项目复测，项目多不保证必然更准。依据：设计 §13.1、§13.6。</title><rect x="620" y="470" width="240" height="90" rx="10" fill="#eef4ff" stroke="#6082b2" stroke-width="1.3"/><rect x="621" y="484" width="3" height="62" rx="1.5" fill="#31577e"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="740" y="502.175">另一新项目</tspan><tspan x="740" y="527.825">自动分析复测</tspan></text></g>
<g class="graph-node" data-node-id="rollback" tabindex="0" role="button" aria-label="回归后 停用／回退：后续发现回归时可停用或退回旧规则版本，并重新计算受影响的结果。"><title>后续发现回归时可停用或退回旧规则版本，并重新计算受影响的结果。
专业说明：设计中后续项目出现回归可切换、停用或回退规则/组合；保留父版本、报告与历史，不只改版本标签继续使用旧推导。依据：设计 §13.2、§13.6。</title><rect x="910" y="470" width="240" height="90" rx="10" fill="#fff6e8" stroke="#d6ab6a" stroke-width="1.3"/><rect x="911" y="484" width="3" height="62" rx="1.5" fill="#a87931"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="1030" y="502.175">回归后</tspan><tspan x="1030" y="527.825">停用／回退</tspan></text></g>
<g class="graph-node" data-node-id="quarantine" tabindex="0" role="button" aria-label="证据不足／失败 保留候选：证据不足或验证失败的规则先保留为候选，记录问题，不能进入正式确认结果。"><title>证据不足或验证失败的规则先保留为候选，记录问题，不能进入正式确认结果。
专业说明：设计中源码核对、独立验证或回归失败时保留候选/反馈，不进入正式确认规则与质量承诺；必需分项缺门槛仍未完成验收。依据：设计 §13.2、§13.6。</title><rect x="620" y="635" width="240" height="80" rx="10" fill="#fff6e8" stroke="#d6ab6a" stroke-width="1.3"/><rect x="621" y="649" width="3" height="52" rx="1.5" fill="#a87931"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="740" y="662.175">证据不足／失败</tspan><tspan x="740" y="687.825">保留候选</tspan></text></g>
<g class="graph-node" data-node-id="rebuild" tabindex="0" role="button" aria-label="依赖失效 重新合并／分析：规则组合变化后让相关旧推导失效，用仍有效的独立依据重新合并和分析。"><title>规则组合变化后让相关旧推导失效，用仍有效的独立依据重新合并和分析。
专业说明：设计中组合变化使直接与传递旧推导失效，剩余规则独立支持的结论重新合并；重建受影响快照，不能删除同目标全部关系。依据：设计 §13.6、§8.2。</title><rect x="910" y="635" width="240" height="80" rx="10" fill="#eef4ff" stroke="#6082b2" stroke-width="1.3"/><rect x="911" y="649" width="3" height="52" rx="1.5" fill="#31577e"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#243b53"><tspan x="1030" y="662.175">依赖失效</tspan><tspan x="1030" y="687.825">重新合并／分析</tspan></text></g>
