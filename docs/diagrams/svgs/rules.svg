<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="rules-title rules-desc">
<title id="rules-title">跨项目规则改进、固化与回退 · 设计图解</title>
<desc id="rules-desc">CodeCartia 计划把错连和漏连转成候选识别规则，经过独立核对和测试后再推广，出现问题时可以回退。 本图描述 CodeCartia 识别规则的改进设计，不改变目标工程的授权策略，闭环尚未通过产品分析验收。 表达 CodeCartia 识别规则的设计闭环，与目标工程的授权策略执行语义无关。候选试运行重建自动副本快照，不覆盖正式图；经证据核对、独立项目验证、冻结基准回归和维护者审查后，才进入版本化规则包。规则应用、停用与回退都改变有效组合并触发重算。</desc>
<style>text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif} .graph-node{cursor:pointer;outline:none}.graph-node:hover rect,.graph-node:focus rect{stroke-width:3;filter:brightness(.97)} .edge-label{pointer-events:none}</style>
